<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Microscope trainer - Elixir Lab (prototype)</title>
<style>
:root{--g:#1f6b4a;--gd:#124a33;--gold:#c9a227;--ink:#1c2b24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#f4f8f5;color:var(--ink)}
header{background:#142b39;color:#fff;padding:12px 16px;border-bottom:3px solid #f0b938}
header b{font-size:18px;font-weight:650;line-height:27px}header small{display:block;color:rgba(255,255,255,.72);font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inapp header{padding-left:44px}
main{max-width:480px;margin:auto;padding:10px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 5px #0002;padding:8px;margin-bottom:10px}
.top{display:flex;gap:8px;align-items:flex-start}
.left{order:2;flex:0 0 40%;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.right{order:1;flex:1;padding:6px}
#scope{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.view{width:100%;max-width:130px;height:auto}
.part{cursor:pointer}.part.sel{filter:drop-shadow(0 0 14px #c9a227) drop-shadow(0 0 6px #c9a227)}
.bar{height:10px;width:100%;background:#dde7e1;border-radius:6px;overflow:hidden}
#fill{height:100%;width:0;background:var(--g);transition:width .1s}
#msg{font-weight:600;color:var(--gd);font-size:14px;min-height:36px}
.hint{font-size:11.5px;color:#6a7a72}
#info{border-left:5px solid var(--gold);min-height:84px;margin-bottom:6px}
#info h3{margin:2px 0 4px;color:var(--g);font-size:16px}#info p{margin:0;font-size:14px;line-height:1.4}
#reset{font:inherit;font-size:14px;border-radius:10px;background:#fff;color:var(--g);border:1px solid var(--g);height:34px;padding:0 14px}
.cap{font-size:11.5px;color:#55665d;text-align:center;margin-top:2px}
</style></head><body>

tube:["Body tube","Carries the image from the objective up to the eyepiece. It moves up and down when you turn the focus knobs."],
arm:["Arm","The curved frame you hold when carrying the microscope. Always carry it with one hand on the arm and one under the base."],
objective:["Objective lenses","The lenses closest to the specimen (4x, 10x, 40x). Start with the lowest power."],
nosepiece:["Revolving nosepiece","Turns to switch between objective lenses."],
stage:["Stage","The flat platform that holds the slide. It stays fixed. The body tube moves when you turn the knobs."],
slide:["Slide","The glass slide with the specimen on it."],
clips:["Stage clips","Hold the slide in place on the stage."],
diaphragm:["Condenser and diaphragm","Controls how much light reaches the specimen."],
mirror:["Mirror / light source","Sends light up through the specimen so you can see it."],
base:["Base","The heavy bottom that keeps the microscope steady."],
coarse:["Coarse focus knob","The big knob. Moves the body tube a lot. Use it first, with the low power objective. Drag around it to turn."],
fine:["Fine focus knob","The small knob. Moves the body tube a little to sharpen the image. Drag around it to turn."]};
const SHARP=-30, CLOSE=-55, MIN=-68, MAX=70, START=40;
let off=START, sel=null;
const $=id=>document.getElementById(id), tg=$('tubegrp');
function show(p){document.querySelectorAll('.part.sel').forEach(e=>e.classList.remove('sel'));
 document.querySelectorAll('.part[data-p="'+p+'"]').forEach(e=>e.classList.add('sel'));
 $('info').innerHTML='<h3>'+INFO[p][0]+'</h3><p>'+INFO[p][1]+'</p>';}
function update(){
 tg.setAttribute('transform','translate(0 '+(-off)+')');
 const d=Math.abs(off-SHARP);
 const blur=d<=1.5?0:Math.min(9,d*.4);
 $('gb').setAttribute('stdDeviation',blur.toFixed(2));
 $('fill').style.width=Math.max(0,100-d*1.6)+'%';
 let m;
 if(off<=CLOSE) m='Too close! The lens could hit the slide. Turn the coarse knob the other way.';
 else if(d<=1.5) m='In focus! Well done.';
 else if(d<=8) m='Almost. Use the fine knob.';
 else m='Blurry. Use the coarse knob first.';
 $('msg').textContent=m; $('msg').style.color=off<=CLOSE?'#b3261e':'';
}
const ang={coarse:0,fine:0}, CEN={coarse:[525.5,547],fine:[410.5,777.5]}, SENS={coarse:.35,fine:.06};
function rot(k){$('r'+k).setAttribute('transform','rotate('+ang[k]+' '+CEN[k][0]+' '+CEN[k][1]+')');}
['coarse','fine'].forEach(k=>{
 const g=$('k'+k); let last=null,moved=0;
 const a=e=>{const r=g.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;};
 g.addEventListener('pointerdown',e=>{g.setPointerCapture(e.pointerId);last=a(e);moved=0;e.preventDefault();});
 g.addEventListener('pointermove',e=>{if(last===null)return;
  let n=a(e),dl=n-last;if(dl>180)dl-=360;if(dl<-180)dl+=360;last=n;moved+=Math.abs(dl);
  ang[k]+=dl;rot(k);off=Math.max(MIN,Math.min(MAX,off-dl*SENS[k]));update();});
 const up=()=>{if(last!==null&&moved<4)show(k);last=null;};
 g.addEventListener('pointerup',up);g.addEventListener('pointercancel',()=>{last=null;});
});
document.querySelectorAll('.part').forEach(e=>{const p=e.dataset.p;if(p!=='coarse'&&p!=='fine')e.addEventListener('click',()=>show(p));});
$('reset').onclick=()=>{off=START;ang.coarse=ang.fine=0;rot('coarse');rot('fine');update();
 document.querySelectorAll('.part.sel').forEach(e=>e.classList.remove('sel'));
 $('info').innerHTML='<h3>Tap any part</h3><p>Tap a part of the microscope to see its name and what it does.</p>';};
window.__set=v=>{off=v;update();};
update();
</script></body></html>
