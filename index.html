<style>
:root{
  --bg:#f5f5f2;--card:#fff;--ink:#2b2a28;--muted:#6b6a66;--line:#e5e4df;
  --pri:#008a4f;--pri2:#e2f4ea;--gold:#fdc10b;--char:#3a3937;--warn:#b42318;--warnbg:#fdecea;--amber:#8a5a00;--amberbg:#fff4dc;
  --r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1412;--card:#18201c;--ink:#e8efeb;--muted:#9aa9a1;--line:#26302b;
  --pri:#00ac62;--pri2:#123826;--gold:#fdc10b;--char:#2a2927;--warn:#ff8a7a;--warnbg:#3a1714;--amber:#f5c46b;--amberbg:#3a2c10;
  --sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--char);border-bottom:3px solid var(--gold);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
#logo{width:34px;height:34px;border-radius:50%;background:#fff;object-fit:cover;flex:none}
.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:22px}
nav button.on{position:relative}nav button.on::after{content:"";position:absolute;top:-6px;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.brandlogo{display:block;width:120px;height:120px;border-radius:50%;margin:4px auto 10px;background:#fff}
header h1{font-size:18px;margin:0;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:none;border:0;color:#fff;font-size:22px;padding:2px 8px 2px 0;cursor:pointer;display:none}
main{padding:14px 14px 96px;max-width:720px;margin:0 auto}
.search{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);border:1px solid var(--line);cursor:pointer;min-height:104px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:15px;line-height:1.25}
.tile small{color:var(--muted);font-size:12.5px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--sh)}
.item b{display:block;font-size:15.5px}
.item span{color:var(--muted);font-size:13.5px}
.sechead{margin:4px 0 12px}
.sechead p{color:var(--muted);margin:4px 0 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--pri)}
.title{font-size:22px;margin:2px 0 4px;line-height:1.25}
.aka{color:var(--muted);font-size:14px;margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--warnbg);color:var(--warn)}
.tag.ok{background:var(--pri2);color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:#0f1412}}
.chips input{width:74px;padding:7px 9px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.q{text-align:right;white-space:nowrap;font-weight:650;padding-left:10px;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.part{font-weight:650;margin:10px 0 2px;font-size:14px;color:var(--muted)}
.part:first-child{margin-top:0}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 38px;border-bottom:1px solid var(--line);cursor:pointer}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--pri2);color:var(--pri);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
ol.steps li.done{color:var(--muted);text-decoration:line-through}
ol.steps li.done::before{content:"✓";background:var(--pri);color:#fff}
.res{background:var(--pri2);border-radius:10px;padding:10px 12px;margin-top:8px}
.safety{background:var(--warnbg);color:var(--ink);border:1px solid transparent}
.safety h3{color:var(--warn)}
.note{background:var(--amberbg)}
.note h3{color:var(--amber)}
.yield{color:var(--muted);font-size:13.5px;margin-top:8px}
.btnrow{display:flex;gap:8px;margin:4px 0 12px}
.btn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px;font-size:14.5px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){.btn.pri{color:#0f1412}}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{background:none;border:0;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 12px;cursor:pointer}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:var(--pri);font-weight:650}
label.f{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.out{margin-top:12px;padding:12px;border-radius:10px;background:var(--pri2);font-size:15px}
.out b{color:var(--pri)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#16211c;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.star{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;display:none}
.item.test{border-left:4px solid var(--pri)}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
.chip.lnk{text-align:left;background:var(--pri2);color:var(--pri);border-color:transparent;font-weight:600}
.mats{margin-top:10px;font-size:14.5px;color:var(--ink)}
.res.pos{background:var(--pri2)}
.res.neg{background:var(--bg);border:1px solid var(--line)}
ul.pc{margin:0;padding-left:20px}ul.pc li{margin:5px 0}
nav button{padding:4px 6px}
.wide{width:100%;flex:none;margin-bottom:14px;padding:13px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--card);color:var(--ink);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.mh{margin:0 0 6px;font-size:18px}
.pick{max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:10px}
label.ck{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
label.ck input{width:20px;height:20px;accent-color:var(--pri)}
.srow{display:flex;gap:6px;margin-bottom:6px}.xbtn{border:1px solid var(--line);background:var(--bg);color:var(--warn);border-radius:10px;width:44px;font-size:16px}
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
table.rs{font-size:14px;min-width:100%}
table.rs th{position:sticky;top:0;background:var(--pri2);color:var(--pri);font-size:12.5px;padding:8px 6px;text-align:left}
table.rs th.sc{text-align:center;min-width:64px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.rs td{padding:8px 6px}
table.rs td.tn{cursor:pointer;min-width:140px}table.rs td.tn small{display:block;color:var(--muted);font-size:12px}
table.rs tr.gh td{background:var(--bg);font-weight:700;font-size:12.5px;color:var(--muted);padding:6px}
td.cell{text-align:center;font-weight:800;font-size:16px;cursor:pointer;border-left:1px solid var(--line);user-select:none}
.cp{color:#0f7a3d}.cn{color:var(--muted)}.cd{color:var(--amber)}
td.cell.cp{background:rgba(15,122,61,.10)}td.cell.cd{background:var(--amberbg)}
@media (prefers-color-scheme:dark){.cp{color:#5fd99a}td.cell.cp{background:rgba(95,217,154,.12)}}
.legend{font-size:13px;color:var(--muted);margin:0 2px 12px;display:flex;flex-wrap:wrap;gap:4px 10px}.legend span{font-weight:700}
.sumrow{padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}.sumrow:last-child{border:0}.muted{color:var(--muted)}
.ico{width:1.1em;height:1.1em;vertical-align:-0.18em;flex:none}
.ico.fill{fill:currentColor}
nav button i .ico{width:23px;height:23px;vertical-align:0}
header .star .ico{width:22px;height:22px;vertical-align:-4px}
.tile .ic{color:var(--pri)}.tile .ic .ico{width:22px;height:22px;vertical-align:0}
.tag .ico{width:12px;height:12px;vertical-align:-1px}
.card h3 .ico{width:15px;height:15px;vertical-align:-2px}
.xbtn .ico{vertical-align:-3px}
.disc{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.45}
</style>
</head>

const SECTIONS=[
 {id:"mount",ic:"microscope",n:"Microscopy – Clearing & Mountants",d:"Clearing agents, mounting media, macerating fluids"},
 {id:"stain",ic:"drop",n:"Microscopy – Stains & Microchemical tests",d:"Lignin, starch, cellulose, fats, mucilage, crystals"},
 {id:"alk",ic:"testtube",n:"Alkaloids",d:"Precipitating & specific colour tests"},
 {id:"carb",ic:"hexagon",n:"Carbohydrates",d:"Molisch, Fehling, Benedict, Barfoed, Seliwanoff…"},

const W="Distilled water";
const R=[
/* ---------- MOUNTANTS / CLEARING ---------- */
{id:"chloral",s:"mount",n:"Chloral hydrate solution",a:"Clearing reagent",u:"Clears sections and powders by dissolving starch, proteins, chlorophyll and resins, so crystals, trichomes, stomata and lignified tissue are seen clearly.",y:55,
 p:[{i:[["Chloral hydrate",50,"g"],[W,20,"mL"]]}],
 m:["Weigh 50 g chloral hydrate into a beaker.","Add 20 mL distilled water.","Warm gently on a water bath with stirring until completely dissolved.","Cool and transfer to a well-closed amber bottle."],
 t:"Place the powder or section on a slide, add 2–3 drops, warm gently over a small flame (do not boil dry), add more reagent if needed, then cover with a cover slip.",
 r:"Clear, transparent tissue; calcium oxalate crystals, hairs, stomata and vessels become distinct.",
 st:"Well-closed amber bottle, room temperature.",h:["Toxic","Irritant"],
 sf:"Harmful if swallowed; irritant to skin and eyes. Chloral hydrate is a controlled substance in some countries – keep it locked and logged.",
 nt:"Starch grains are destroyed – to examine starch, mount in water or dilute glycerol instead. If crystals form on the slide after cooling, add 1 drop of dilute glycerol. Ph. Eur. uses a stronger version (80 g in 20 mL water)."},
{id:"glyc50",s:"mount",n:"Dilute glycerol (50%)",a:"Glycerol–water mountant",u:"General temporary mountant; prevents the preparation drying out. Ideal for starch grains and cell contents.",y:100,
 p:[{i:[["Glycerol",50,"mL"],[W,50,"mL"]]}],
 m:["Measure 50 mL glycerol (it is viscous – pour slowly).","Add 50 mL distilled water.","Mix well and bottle."],
 t:"Add 1–2 drops to the specimen on the slide and apply a cover slip.",r:"—",
 st:"Closed bottle; add a small crystal of thymol to prevent mould for long storage.",h:[],sf:"Low hazard.",nt:"Good for observing starch, which chloral hydrate would destroy."},
{id:"glyjelly",s:"mount",n:"Glycerin jelly (Kaiser's)",a:"Glycerol–gelatin",u:"Semi-permanent mounting medium for sections and powders.",y:100,
 p:[{i:[["Gelatin",7,"g"],[W,42,"mL"],["Glycerol",50,"g"],["Phenol (preservative)",0.5,"g"]]}],
 m:["Soak the gelatin in the water for about 2 hours until swollen.","Add the glycerol and phenol.","Warm on a water bath (60–70 °C) for 10–15 min, stirring gently, until clear.","Filter while hot through glass wool.","Pour into small jars; it sets on cooling."],
 t:"Melt a small piece on the slide (warm gently), place the specimen in it, cover with a cover slip. Seal the edges with nail varnish for long-term slides.",r:"—",

 pr:["Add 3–5 drops fuming nitric acid to the residue in a porcelain dish.","Evaporate to dryness on a water bath in the fume hood.","Cool; dissolve the yellow residue in 1–2 mL acetone.","Add 1–2 drops 3% ethanolic KOH."],
 pos:"Violet colour → tropane ester alkaloids.",neg:"No violet colour.",ctl:"Atropine sulfate as positive.",
 pc:["Fuming HNO₃ – fume hood, gloves, goggles.","Residue must be completely dry before adding acetone.","Strychnine and some other alkaloids give interfering colours – use purified extract."]},
{id:"t_murex",c:"alk",n:"Murexide test (purine alkaloids)",aim:"Caffeine, theobromine, theophylline.",need:["murexide"],ex:["Porcelain dish","Water bath"],
 smp:"Small amount of residue or powdered tea/coffee/cocoa extract residue.",
 pr:["Mix the residue with a few crystals of potassium chlorate.","Add 1–2 drops conc. HCl.","Evaporate to dryness on a water bath.","Invert the dish over an open bottle of ammonia (or add a drop of dilute ammonia)."],
 pos:"Residue turns purple (murexide) → purine alkaloids.",neg:"No purple colour.",ctl:"Caffeine as positive.",
 pc:["KClO₃ is a strong oxidizer – small amounts only, keep away from organic matter in bulk.","Fume hood (chlorine, HCl, NH₃ vapours)."]},
{id:"t_thal",c:"alk",n:"Thalleioquin test (quinine)",aim:"Quinine and quinidine (Cinchona).",need:["thalle","nh3"],ex:["Test tube","UV lamp 366 nm (optional)"],
 smp:"2 mL faintly acidic solution of the alkaloid.",
 pr:["Add 2–3 drops bromine water to 2 mL of the solution.","Add excess 10% ammonia."],
 pos:"Emerald-green colour → quinine/quinidine.",neg:"No green colour.",ctl:"Quinine sulfate.",
 pc:["Bromine is very toxic – fume hood, gloves.","Too much bromine destroys the colour – use only a few drops.","Supporting test: quinine shows blue fluorescence in dilute H₂SO₄ under UV 366 nm."]},
{id:"t_vanurk",c:"alk",n:"Van Urk test (ergot alkaloids)",aim:"Ergot / indole alkaloids.",need:["vanurk"],ex:["Test tube"],
 smp:"1 mL alkaloid solution.",pr:["Add 1–2 mL Van Urk's reagent to 1 mL of the solution and mix carefully."],
 pos:"Blue to violet-blue colour.",neg:"No blue colour.",ctl:"",pc:["Reagent is concentrated acid – goggles.","Use reagent within 7 days."]},

/* ---- CARBOHYDRATES ---- */
{id:"t_molisch",c:"carb",n:"Molisch's test",aim:"General test for all carbohydrates (free or combined).",need:["molisch"],ex:["Test tubes","Conc. H₂SO₄"],
 smp:"2 mL aqueous extract or sugar solution.",
 pr:["Add 2 drops Molisch's reagent to 2 mL sample; mix.","Incline the tube and carefully pour 1–2 mL conc. H₂SO₄ down the side so it forms a lower layer.","Do not shake; observe the interface."],
 pos:"Violet/purple ring at the junction of the two layers.",neg:"No violet ring (a green ring may appear from reagent alone).",ctl:"Glucose 1% (positive) and water (blank).",
 pc:["Very sensitive but non-specific: glycosides and some other compounds also react.","Excess reagent gives a green ring – use only 2 drops.","Pour acid slowly with tube pointed away from people; heat is generated."]},
{id:"t_fehling",c:"carb",n:"Fehling's test",aim:"Reducing sugars.",need:["fehling"],ex:["Boiling water bath","Test tubes"],
 smp:"2 mL aqueous extract or sugar solution.",
 pr:["Mix 1 mL Fehling's A + 1 mL Fehling's B (deep blue).","Add 2 mL sample.","Heat in a boiling water bath for 2–5 min."],
 pos:"Green → yellow → brick-red precipitate (Cu₂O).",neg:"Solution stays clear blue.",ctl:"Glucose 1% (positive), sucrose 1% (negative).",
 pc:["Mix A and B only at the time of use.","Sucrose and starch are negative – hydrolyse first (see non-reducing sugar test).","Strongly coloured extracts mask the colour – decolorize with charcoal or dilute.","Solution B is caustic."]},
{id:"t_bened",c:"carb",n:"Benedict's test",aim:"Reducing sugars (semi-quantitative).",need:["benedict"],ex:["Boiling water bath"],
 smp:"0.5 mL (8 drops) sample.",
 pr:["Put 5 mL Benedict's reagent in a tube.","Add 8 drops of sample and mix.","Heat in boiling water bath for 3–5 min; let cool."],
 pos:"Green (trace) → yellow → orange → brick-red (large amount).",neg:"Remains blue.",ctl:"Glucose 1% and water.",
 pc:["Ratio matters: too much sample gives false strong colours.","Ascorbic acid and other reducing agents can give false positives."]},
{id:"t_barf",c:"carb",n:"Barfoed's test",aim:"Distinguish monosaccharides from reducing disaccharides.",need:["barfoed"],ex:["Boiling water bath","Timer"],
 smp:"1 mL sugar solution.",
 pr:["Add 1 mL sample to 2 mL Barfoed's reagent.","Heat in a boiling water bath for exactly 2–3 min.","Remove and let stand; observe the bottom of the tube."],
 pos:"Red precipitate within 2–3 min → monosaccharide (glucose, fructose).",neg:"No ppt in 3 min → disaccharide (maltose, lactose) or non-reducing sugar.",ctl:"Glucose and maltose side by side.",
 pc:["Heating longer than ~5 min hydrolyses disaccharides → false positive.","Use a timer and run the controls in parallel."]},
{id:"t_selw",c:"carb",n:"Seliwanoff's test",aim:"Ketoses (fructose; sucrose and inulin after hydrolysis in situ).",need:["seliwanoff"],ex:["Boiling water bath","Timer"],
 smp:"1 mL sugar solution.",pr:["Add 1 mL sample to 3 mL Seliwanoff's reagent.","Heat in a boiling water bath for 1 min (max 2 min)."],
 pos:"Cherry-red within 1 min → ketose.",neg:"No colour or faint pink after longer heating → aldose.",ctl:"Fructose and glucose side by side.",
 pc:["Prolonged heating converts glucose too → false positive.","Concentrated sugar solutions give misleading colours – use ~1%."]},
{id:"t_bial",c:"carb",n:"Bial's test",aim:"Pentoses (e.g. arabinose in gums).",need:["bial"],ex:["Boiling water bath"],
 smp:"1 mL hydrolysed sample.",pr:["Add 1 mL sample to 2 mL Bial's reagent.","Heat in a boiling water bath until colour develops (1–2 min)."],
 pos:"Blue-green colour → pentose.",neg:"Yellow-brown → hexoses.",ctl:"Arabinose or xylose.",
 pc:["Conc. HCl – fume hood.","Polysaccharides (gums) must be hydrolysed first (boil with dilute acid)."]},
{id:"t_iod",c:"carb",n:"Iodine test for starch",aim:"Starch, dextrins, glycogen in solution.",need:["iodine"],ex:["Test tubes","Water bath"],
 smp:"2 mL aqueous extract (cooled).",pr:["Add 1–2 drops iodine solution to 2 mL cooled sample.","Optional: heat the blue solution, then cool again."],
 pos:"Blue-black → starch (colour disappears on heating and returns on cooling). Red-brown → dextrins or glycogen.",neg:"Yellow (colour of iodine).",ctl:"1% starch solution.",
 pc:["Test must be done cold.","Strongly acidic or alkaline solutions give weak results – neutralize first."]},
{id:"t_nonred",c:"carb",n:"Test for non-reducing sugars (sucrose)",aim:"Detect sucrose / non-reducing sugars after hydrolysis.",need:["fehling","dhcl","naoh10"],ex:["Boiling water bath","Litmus paper"],
 smp:"2 mL sample that is NEGATIVE with Fehling's.",
 pr:["Add 1 mL dilute HCl to 2 mL sample.","Heat in a boiling water bath for 5 min (hydrolysis).","Cool and neutralize with 10% NaOH (check with litmus).","Perform Fehling's test on the hydrolysate."],
 pos:"Brick-red ppt after hydrolysis (but not before) → non-reducing sugar.",neg:"No ppt.",ctl:"Sucrose 1%.",
 pc:["Neutralization is essential – excess acid destroys the Fehling's reagent.","Always confirm the sample was negative before hydrolysis."]},
{id:"t_osaz",c:"carb",n:"Osazone formation",aim:"Identify reducing sugars by osazone crystal shape.",need:["osazone"],ex:["Boiling water bath","Microscope"],
 smp:"5 mL sugar solution (~1%).",
 pr:["Add ~0.3 g osazone mixture to 5 mL sample; dissolve.","Heat in boiling water bath for 20–30 min, noting the time crystals appear.","Cool slowly; examine crystals under the microscope."],
 pos:"Glucose/fructose: needle (broom/sheaf) crystals in ~5 min (hot). Maltose: sunflower-shaped. Lactose: powder-puff/hedgehog (form on cooling).",neg:"No crystals (sucrose – non-reducing).",ctl:"",
 pc:["Phenylhydrazine is toxic and a suspected carcinogen – gloves, fume hood.","Cool slowly; rapid cooling gives poorly formed crystals."]},

/* ---- GLYCOSIDES ---- */
{id:"t_keller",c:"gly",n:"Keller–Killiani test",aim:"2-Deoxysugars (digitoxose) of cardiac glycosides.",need:["keller","p_eth"],ex:["Porcelain dish","Conc. H₂SO₄"],
 smp:"Dry residue of ethanolic extract (or chloroform extract after lead acetate cleanup).",
 pr:["Dissolve the residue in 2 mL Keller–Killiani reagent (FeCl₃–acetic acid).","Transfer to a dry test tube.","Incline the tube and carefully underlay 1 mL conc. H₂SO₄ down the side."],
 pos:"Reddish-brown ring at the interface; upper layer slowly becomes blue-green.",neg:"No reddish-brown ring / no blue-green.",ctl:"Digitalis leaf extract.",
 pc:["Do not shake.","Glassware must be dry.","The test is for 2-deoxysugars – cardiac glycosides without them (e.g. some Strophanthus) can be negative."]},
{id:"t_kedde",c:"gly",n:"Kedde test",aim:"Five-membered unsaturated lactone of cardenolides.",need:["kedde"],ex:["Test tube"],
 smp:"Methanolic/ethanolic extract.",pr:["Mix equal volumes of Kedde's A and B.","Add 1 mL of the mixture to 1 mL extract."],
 pos:"Purple to violet colour (fades).",neg:"No violet colour.",ctl:"Digitalis extract.",
 pc:["Observe immediately – colour fades.","Bufadienolides (squill) are negative.","Methanol toxic."]},
{id:"t_baljet",c:"gly",n:"Baljet test",aim:"Cardenolide lactone ring.",need:["baljet"],ex:["Test tube"],
 smp:"Extract or thin section.",pr:["Add a few drops of freshly mixed Baljet's reagent to the extract or section."],
 pos:"Orange to orange-red colour.",neg:"Yellow (colour of picrate).",ctl:"",pc:["Picric acid: explosive when dry – keep stocks wet.","Not highly specific – confirm with Kedde/Keller–Killiani."]},
{id:"t_legal",c:"gly",n:"Legal's test",aim:"Cardenolides.",need:["legal","naoh10"],ex:["Pyridine","Test tube"],
 smp:"Dry extract residue.",pr:["Dissolve the residue in 1 mL pyridine.","Add 1–2 drops fresh 2% sodium nitroprusside.","Make alkaline with a few drops 10% NaOH."],
 pos:"Pink to blood-red colour (fades).",neg:"No red colour.",ctl:"",pc:["Pyridine: fume hood.","Nitroprusside must be freshly prepared and protected from light."]},
{id:"t_born",c:"gly",n:"Borntrager's test (free anthraquinones)",aim:"Free anthraquinone aglycones.",need:["born"],ex:["Chloroform","Separating funnel / test tube"],
 smp:"0.2 g powdered drug.",
 pr:["Shake 0.2 g powder with 5 mL chloroform for 5 min.","Filter.","Add 2 mL 10% ammonia to the filtrate and shake."],
 pos:"Rose-pink to red colour in the ammoniacal (upper) layer.",neg:"Ammonia layer stays colourless.",ctl:"Rhubarb or cascara.",
 pc:["Most anthraquinones in senna/cascara are glycosides → use the modified test.","Chloroform is toxic – fume hood.","Avoid benzene (carcinogenic)."]},
{id:"t_bornm",c:"gly",n:"Modified Borntrager's test (O- & C-glycosides)",aim:"Anthraquinone glycosides after hydrolysis.",need:["born","dh2so4","fecl3","dhcl"],ex:["Water bath","Chloroform"],
 smp:"0.2 g powdered drug.",
 pr:["O-glycosides (senna, rhubarb, cascara): boil 0.2 g powder with 5 mL dilute H₂SO₄ for 2–3 min.","C-glycosides (aloe – aloin): boil 0.2 g powder with 5 mL 5% FeCl₃ + 5 mL dilute HCl for ~5 min (oxidative hydrolysis).","Filter while hot; cool the filtrate.","Shake with 5 mL chloroform; separate the chloroform layer.","Add 2 mL 10% ammonia to the chloroform layer and shake."],
 pos:"Pink to red ammoniacal layer → anthraquinone glycosides.",neg:"No pink colour.",ctl:"Senna leaf (O-glycoside), aloe (C-glycoside).",
 pc:["C-glycosides (aloin) are NOT hydrolysed by acid alone – FeCl₃ is required.","Filter hot – anthraquinones may precipitate on cooling.","Fume hood for chloroform and ammonia."]},
{id:"t_cyan",c:"gly",n:"Test for cyanogenic glycosides",aim:"HCN released by enzymatic hydrolysis.",need:["picrate"],ex:["Test tube with cork","Incubator/water bath 37 °C"],
 smp:"1–2 g freshly crushed drug.",
 pr:["Place the crushed drug in a test tube and moisten with a few drops of water (± 1 drop chloroform to aid enzyme action).","Moisten a picrate paper strip with 10% Na₂CO₃.","Suspend the strip from the cork above the drug – it must not touch it.","Stopper tightly; keep at ~37 °C for 15–60 min."],
 pos:"Paper turns orange → brick-red.",neg:"Paper stays yellow.",ctl:"Bitter almond or linseed (positive).",
 pc:["HCN is extremely toxic – open the tube only in a fume hood.","Heat-dried or old drugs may have inactive enzyme → add emulsin/enzyme source or acid hydrolysis.","Dry picric acid is explosive."]},
{id:"t_froth",c:"gly",n:"Froth (foam) test for saponins",aim:"Saponins.",need:["froth","p_aq"],ex:["Graduated test tube with stopper","Ruler"],
 smp:"Aqueous extract of 0.5–1 g drug (cooled, filtered).",
 pr:["Put 10 mL of the cooled aqueous extract in a graduated test tube.","Stopper and shake vigorously for 15 seconds.","Let stand and measure froth height after 10–15 min."],
 pos:"Honeycomb froth ≥1 cm persisting 10–15 min → saponins.",neg:"Froth collapses within a few minutes.",ctl:"Quillaja or glycyrrhiza.",
 pc:["Proteins and some other compounds give transient froth – persistence is the key.","Confirm with haemolysis test or Liebermann–Burchard on the aglycone.","Froth index (quantitative) uses serial dilutions – this is the qualitative version."]},

/* ---- PHENOLICS ---- */
{id:"t_fecl3",c:"phen",n:"Ferric chloride test",aim:"Phenolics and tannins; tannin type.",need:["fecl3","p_aq"],ex:["Test tubes"],
 smp:"2 mL aqueous or ethanolic extract.",pr:["Add 2–3 drops 5% FeCl₃ to 2 mL extract."],
 pos:"Blue-black → hydrolysable (gallic) tannins. Green-black → condensed (catechol) tannins / phenolics.",neg:"No change (yellow-orange of reagent).",ctl:"Tannic acid 0.5%.",
 pc:["Non-specific: any phenolic OH reacts – confirm tannins with gelatin test.","Excess reagent masks colour – add dropwise.","Very dilute extracts give only faint colour."]},
{id:"t_gel",c:"phen",n:"Gelatin–salt test",aim:"Confirm true tannins (they precipitate proteins).",need:["gelatin","p_aq"],ex:["Test tubes"],
 smp:"2 mL aqueous extract.",pr:["Add a few drops of gelatin–salt reagent to 2 mL extract.","Mix and observe."],
 pos:"White precipitate → tannins.",neg:"No precipitate (simple phenolics such as gallic acid don't precipitate).",ctl:"Tannic acid 0.5%.",
 pc:["Gelatin reagent spoils – keep refrigerated, renew weekly.","A salt-only blank (10% NaCl) rules out salting-out of other compounds."]},
{id:"t_lead",c:"phen",n:"Lead acetate test",aim:"Tannins, flavonoids and other phenolics.",need:["leadac","p_aq"],ex:["Test tubes"],
 smp:"2 mL extract.",pr:["Add a few drops 10% lead acetate to the extract."],pos:"White, yellow or buff precipitate.",neg:"No precipitate.",ctl:"",
 pc:["Lead is toxic – gloves; collect waste.","Many compounds (acids, proteins, gums) also precipitate – supportive test only."]},
{id:"t_shin",c:"phen",n:"Shinoda test",aim:"Flavonoids (flavones, flavonols, flavanones).",need:["shinoda","p_eth"],ex:["Magnesium turnings","Conc. HCl"],
 smp:"2 mL ethanolic extract.",pr:["Add a few magnesium turnings to 2 mL extract.","Add conc. HCl dropwise (5–6 drops).","Wait for effervescence to stop; observe colour."],
 pos:"Pink, red, crimson or magenta → flavonoids.",neg:"No colour change (chalcones/aurones/isoflavones may be negative).",ctl:"Rutin or quercetin.",
 pc:["H₂ gas forms – no flames nearby.","Red anthocyanin pigments in the extract give a false positive – check the extract colour + HCl without Mg as blank."]},
{id:"t_alk_fl",c:"phen",n:"Alkaline reagent test",aim:"Flavonoids.",need:["naoh10","dhcl"],ex:["Test tubes"],
 smp:"2 mL extract.",pr:["Add a few drops 10% NaOH to the extract.","Then add dilute HCl dropwise."],
 pos:"Intense yellow with NaOH that becomes colourless with dilute acid → flavonoids.",neg:"No yellow colour.",ctl:"",pc:["Other phenolics and chlorophyll may also change colour – use as a supportive test."]},
{id:"t_alcl",c:"phen",n:"Aluminium chloride test",aim:"Flavonoids (especially flavones and flavonols).",need:["alcl3"],ex:["UV lamp 366 nm"],
 smp:"Ethanolic extract.",pr:["Add a few drops 1% AlCl₃ to 2 mL extract, or spot extract on filter paper/TLC and spray.","Observe in daylight and under UV 366 nm."],
 pos:"Yellow colour; intense yellow fluorescence under UV.",neg:"No yellow/fluorescence.",ctl:"Quercetin.",pc:["Never look directly at UV lamp – use UV goggles."]},

/* ---- TERPENOIDS ---- */
{id:"t_lb",c:"terp",n:"Liebermann–Burchard test",aim:"Steroids and triterpenoids.",need:["lb","p_eth"],ex:["Dry test tube","Ice bath"],
 smp:"Completely dry residue of chloroform or ethanolic extract.",
 pr:["Dissolve the residue in 2 mL chloroform.","Add 1 mL acetic anhydride; mix and cool in ice.","Add 2–3 drops conc. H₂SO₄ carefully down the side.","Observe colour changes over 5 min."],
 pos:"Red → violet → blue → green. Blue-green = steroids (sterols, steroidal saponins). Pink-red/purple = triterpenoids.",neg:"No colour change (or only brown charring).",ctl:"Cholesterol or β-sitosterol.",
 pc:["Moisture spoils the test – use dry glassware and dry residue.","Chlorophyll gives a green colour – remove it (charcoal or petroleum ether extract) or use a blank.","Acetic anhydride is corrosive and lachrymatory – fume hood."]},
{id:"t_salk",c:"terp",n:"Salkowski test",aim:"Sterols and triterpenes.",need:["salk","p_eth"],ex:["Test tube"],
 smp:"Dry residue in chloroform.",pr:["Dissolve residue in 2 mL chloroform.","Carefully add 2 mL conc. H₂SO₄ down the side to form a lower layer.","Do not shake; observe both layers."],
 pos:"Red to reddish-brown chloroform (upper) layer; acid layer with yellow-green fluorescence → sterols. Golden-yellow → triterpenes.",neg:"No red colour.",ctl:"Cholesterol.",
 pc:["Conc. H₂SO₄ – add slowly; heat evolves.","Use a white background to read colours."]},
{id:"t_voil",c:"terp",n:"Tests for volatile oils",aim:"Detect volatile oils in drugs and extracts.",need:["sudan","voil"],ex:["Filter paper","Slides"],
 smp:"Section, powder or petroleum ether extract.",
 pr:["Microscopy: mount section in Sudan III; oil glands/ducts/secretory cells stain red.","Paper test: put a drop of extract on filter paper and let stand.","Odour: crush the drug and note aromatic odour."],
 pos:"Red-stained oil droplets; spot on paper disappears (evaporates) → volatile oil.",neg:"A translucent permanent spot → fixed oil (not volatile).",ctl:"Clove or fennel.",
 pc:["Sudan III stains both fixed and volatile oils – combine with the paper test.","Confirm by TLC with anisaldehyde–H₂SO₄."]},

/* ---- PROTEINS ---- */
{id:"t_ninh",c:"prot",n:"Ninhydrin test",aim:"Free amino acids and proteins.",need:["ninhydrin"],ex:["Boiling water bath"],
 smp:"2 mL aqueous extract (neutral).",pr:["Add 0.5 mL ninhydrin reagent to 2 mL sample.","Heat in a boiling water bath for 1–2 min."],
 pos:"Blue-purple (Ruhemann's purple). Proline → yellow.",neg:"No colour.",ctl:"Glycine 0.1%.",
 pc:["Ammonia/ammonium salts also give purple – avoid ammonia-containing samples.","Ninhydrin stains skin for days – gloves."]},
{id:"t_biur",c:"prot",n:"Biuret test",aim:"Proteins and peptides.",need:["biuret"],ex:["Test tubes"],
 smp:"2 mL sample.",pr:["Add 2 mL 10% NaOH to 2 mL sample; mix.","Add 1–2 drops 1% CuSO₄; mix."],
 pos:"Violet / purple colour.",neg:"Blue (colour of copper reagent).",ctl:"Egg albumin solution.",
 pc:["Add CuSO₄ drop by drop – excess gives a blue colour that masks the result.","NaOH is caustic."]},
{id:"t_xan",c:"prot",n:"Xanthoproteic test",aim:"Proteins with aromatic amino acids.",need:["xantho"],ex:["Water bath"],
 smp:"2 mL sample.",pr:["Add 1 mL conc. HNO₃ to 2 mL sample (white ppt may form).","Heat gently; cool.","Add 10% ammonia until alkaline."],
 pos:"Yellow on heating → orange with ammonia.",neg:"No yellow colour.",ctl:"Egg albumin.",pc:["Conc. HNO₃ – fume hood; stains skin yellow.","Heat gently, tube pointed away."]},

/* ---- TLC ---- */
{id:"t_tlc",c:"tlc",n:"General TLC procedure & detection",aim:"Separate and detect constituents; compare with reference standards.",need:["anis","drag","nppeg","kohtlc","h2so4tlc","iodvap"],ex:["Silica gel plate (F254)","Capillary tubes","TLC tank with lid","Filter paper (saturation)","Pencil & ruler","Sprayer","Hot plate / oven","UV lamp 254 & 366 nm"],
 smp:"Concentrated extract (methanol/ethanol) and reference standard solutions (~1 mg/mL).",
 pr:["Pour the mobile phase into the tank (depth ~0.5 cm), line with filter paper, close, and saturate 15–30 min.","With a soft pencil, draw the start line 1–1.5 cm from the bottom of the plate.","Apply sample and standard as small spots or bands (2–5 mm), at least 1 cm apart; dry between applications.","Place the plate in the tank – the start line must be ABOVE the solvent level. Close the lid.","Develop until the solvent front is ~1 cm from the top; remove and immediately mark the front with pencil.","Dry the plate completely (fume hood / hair dryer).","View under UV 254 nm (dark spots) and 366 nm (fluorescent spots); circle spots with pencil.","Spray evenly with the detection reagent (fine mist – do not wet), heat if required, observe.","Calculate Rf = distance travelled by spot ÷ distance travelled by solvent front."],
 pos:"Spot in the sample with the same Rf and colour as the standard → compound probably present.",neg:"No spot matching the standard.",ctl:"Always co-chromatograph a reference standard on the same plate.",
 pc:["Spots too large or overloaded → tailing and poor separation; keep spots small.","Never spot below the solvent level – sample dissolves into the solvent.","Remove all solvent (especially acids/ammonia) before spraying.","Spray in a fume hood; most sprays contain conc. H₂SO₄ or methanol.","Rf varies with saturation, temperature and plate – compare only with standards on the same plate.","UV light damages eyes – use protective glasses."]}
];

const un=s=>s.replace(/&amp;/g,"&");
function recipeText(r){return `${r.n} (${r.a})\nUse: ${r.u}\n\nIngredients${factor!==1?` (×${fmt(factor)})`:""}:\n`+r.p.map(p=>(p.t?p.t+":\n":"")+p.i.map(i=>`• ${i[0]}: ${un(qtyStr(i))}`).join("\n")).join("\n")+`\n\nPreparation:\n`+r.m.map((s,k)=>`${k+1}. ${s}`).join("\n")+(r.t&&r.t!=="—"?`\n\nTest: ${r.t}`:"")+(r.r&&r.r!=="—"?`\nPositive: ${r.r}`:"")+`\nStorage: ${r.st}\nSafety: ${r.sf}`}
function testText(t){const nm=id=>(byId(id)||tById(id)||{}).n;return `${t.n}\nAim: ${t.aim}\n`+(t.need.length?`Prepare: ${t.need.map(nm).filter(Boolean).join(", ")}\n`:"")+(t.ex.length?`Also needed: ${t.ex.join(", ")}\n`:"")+`Sample: ${t.smp}\n\nProcedure:\n`+t.pr.map((s,k)=>`${k+1}. ${s}`).join("\n")+(t.pos!=="—"?`\n\nPositive: ${t.pos}`:"")+(t.neg!=="—"?`\nNegative: ${t.neg}`:"")+(t.ctl?`\nControls: ${t.ctl}`:"")+(t.pc.length?`\n\nPrecautions:\n`+t.pc.map(p=>`• ${p}`).join("\n"):"")}

   const pk=q("#pick");if(preset==="custom"){pk.style.display="block";pk.innerHTML=testPicker([])}else pk.style.display="none"});
  q("#nc").onclick=close;
  q("#nok").onclick=()=>{const names=q("#ns").value.split(",").map(x=>x.trim()).filter(Boolean);
   const tests=preset==="custom"?[...m.querySelectorAll("#pick input:checked")].map(x=>x.value):PRESETS.find(p=>p.id===preset).t;
   if(!names.length){toast("Add at least one sample");return}if(!tests.length){toast("Pick at least one test");return}
   const sh={id:uid(),title:q("#nt").value.trim()||PRESETS.find(p=>p.id===preset).n,date:today(),samples:names.map(n=>({id:uid(),n})),tests,v:{},notes:""};
   store.sheets.push(sh);save();close();go("sheet-"+sh.id)}})}

function cellCls(v){return v==="+++"||v==="++"||v==="+"?"cp":v==="–"?"cn":v==="±"?"cd":""}
function sheet(id){const s=shById(id);if(!s)return results();setHeader("Results sheet",true);navOn("results");
 const groups=[];TSECS.forEach(g=>{const ts=s.tests.filter(t=>tById(t)&&tById(t).c===g.id);if(ts.length)groups.push([g,ts])});
 app.innerHTML=`<h2 class="title" id="ttl">${esc(s.title)}</h2><p class="aka">${s.date} · tap a cell to cycle: + → ++ → +++ → ± → – → blank</p>
 <div class="tblwrap"><table class="rs"><thead><tr><th>Test</th>${s.samples.map(x=>`<th class="sc">${esc(x.n)}</th>`).join("")}</tr></thead><tbody>
 ${groups.map(([g,ts])=>`<tr class="gh"><td colspan="${s.samples.length+1}">${ico(g.ic)} ${esc(g.n.replace(" tests",""))}</td></tr>`+ts.map(t=>`<tr><td class="tn" data-go="t-${t}">${esc(tById(t).n.replace(/ \(.*\)$/,""))}<small>${esc(CL[t]||"")}</small></td>${s.samples.map(x=>{const v=s.v[t+"|"+x.id]||"";return `<td class="cell ${cellCls(v)}" data-k="${t}|${x.id}">${v}</td>`}).join("")}</tr>`).join("")).join("")}
 </tbody></table></div>
 <div class="legend"><span class="cp">+ / ++ / +++</span> present (weak→strong) <span class="cd">±</span> doubtful <span class="cn">–</span> absent</div>
 <div class="card"><h3>Summary</h3><div id="sum"></div></div>
 <div class="card"><h3>Notes</h3><textarea class="inp" id="notes" rows="3" placeholder="Observations, extract details, deviations…">${esc(s.notes)}</textarea></div>
 <div class="btnrow"><button class="btn pri" id="ctab">Copy table</button><button class="btn pri" id="crep">Copy report</button></div>
 <div class="btnrow"><button class="btn" id="edit">Edit sheet</button><button class="btn danger" id="del">Delete</button></div>
 <p class="disc">“Copy table” pastes as a table into Excel / Google Sheets (and Word via Paste → Keep text, then Convert text to table). “Copy report” gives a readable summary for WhatsApp or a lab report.</p>`;
 const drawSum=()=>{$("#sum").innerHTML=s.samples.map(x=>{const r=summary(s,x);return `<div class="sumrow"><b>${esc(x.n)}</b><br>${r.pos.length?`<span class="cp">Present:</span> ${r.pos.map(esc).join(", ")}<br>`:""}${r.dbt.length?`<span class="cd">Doubtful:</span> ${r.dbt.map(esc).join(", ")}<br>`:""}${r.neg.length?`<span class="cn">Absent:</span> ${r.neg.map(esc).join(", ")}`:""}${!r.pos.length&&!r.dbt.length&&!r.neg.length?`<span class="muted">No results recorded yet.</span>`:""}</div>`}).join("")};
 drawSum();bind();
 app.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{const k=c.dataset.k,v=s.v[k]||"",nv=VALS[(VALS.indexOf(v)+1)%VALS.length];
  if(nv)s.v[k]=nv;else delete s.v[k];c.textContent=nv;c.className="cell "+cellCls(nv);save();drawSum()});
 $("#notes").oninput=e=>{s.notes=e.target.value;save()};
 $("#ctab").onclick=()=>copyText(sheetTSV(s));$("#crep").onclick=()=>copyText(sheetReport(s));
 $("#del").onclick=()=>confirmBox(`Delete “${s.title}”? This cannot be undone.`,()=>{store.sheets=store.sheets.filter(x=>x.id!==s.id);save();toast("Deleted");go("results")});
 $("#edit").onclick=()=>editSheet(s)}

function summary(s,x){const best={};s.tests.forEach(t=>{const lab=CL[t]||tById(t).n,v=s.v[t+"|"+x.id]||"";if(!(lab in best)||RANK[v]>RANK[best[lab]])best[lab]=v});
 const pos=[],dbt=[],neg=[];Object.entries(best).forEach(([l,v])=>{if(RANK[v]>=3)pos.push(`${l} (${v})`);else if(v==="±")dbt.push(l);else if(v==="–")neg.push(l)});return {pos,dbt,neg}}
function sheetTSV(s){return ["Test\tDetects\t"+s.samples.map(x=>x.n).join("\t"),...s.tests.map(t=>`${tById(t).n}\t${CL[t]||""}\t`+s.samples.map(x=>(s.v[t+"|"+x.id]||"").replace("–","-")).join("\t"))].join("\n")}
function sheetReport(s){return `${s.title}\nDate: ${s.date}\n\n`+s.samples.map(x=>{const r=summary(s,x);return `▸ ${x.n}\n`+s.tests.map(t=>`  • ${tById(t).n}: ${s.v[t+"|"+x.id]||"not recorded"}`).join("\n")+`\n  Present: ${r.pos.join(", ")||"—"}\n  Absent: ${r.neg.join(", ")||"—"}`+(r.dbt.length?`\n  Doubtful: ${r.dbt.join(", ")}`:"")}).join("\n\n")+(s.notes?`\n\nNotes: ${s.notes}`:"")+`\n\nKey: + weak, ++ moderate, +++ strong, ± doubtful, – absent`}

function editSheet(s){
 modal(`<h3 class="mh">Edit sheet</h3>
 <label class="f">Title</label><input class="inp" id="et" value="${esc(s.title)}">
 <label class="f">Samples</label><div id="es">${s.samples.map(x=>`<div class="srow" data-id="${x.id}"><input class="inp" value="${esc(x.n)}"><button class="xbtn" aria-label="Remove">${ico("x")}</button></div>`).join("")}</div>
 <button class="chip" id="eadd" style="margin-top:8px">${ico("plus")} Add sample</button>
 <label class="f">Tests</label><div class="pick" style="display:block">${testPicker(s.tests)}</div>
 <div class="btnrow" style="margin-top:14px"><button class="btn" id="ec">Cancel</button><button class="btn pri" id="eok">Save</button></div>`,
 (m,close)=>{const q=x=>m.querySelector(x);
  const wire=()=>m.querySelectorAll(".xbtn").forEach(b=>b.onclick=()=>{if(m.querySelectorAll(".srow").length>1)b.parentNode.remove();else toast("Keep at least one sample")});wire();
  q("#eadd").onclick=()=>{const d=document.createElement("div");d.className="srow";d.dataset.id=uid();d.innerHTML=`<input class="inp" placeholder="Sample name"><button class="xbtn">${ico("x")}</button>`;q("#es").appendChild(d);wire();d.querySelector("input").focus()};
  q("#ec").onclick=close;
  q("#eok").onclick=()=>{const tests=[...m.querySelectorAll(".pick input:checked")].map(x=>x.value);if(!tests.length){toast("Pick at least one test");return}
   const samples=[...m.querySelectorAll(".srow")].map(r=>({id:r.dataset.id,n:r.querySelector("input").value.trim()})).filter(x=>x.n);if(!samples.length){toast("Add a sample");return}
   s.title=q("#et").value.trim()||s.title;s.samples=samples;
   const keep=s.tests.filter(t=>tests.includes(t));s.tests=keep.concat(tests.filter(t=>!keep.includes(t)));
   Object.keys(s.v).forEach(k=>{const [t,sid]=k.split("|");if(!tests.includes(t)||!samples.some(x=>x.id===sid))delete s.v[k]});
   save();close();sheet(s.id)}})}

/* ============ CONTENT LOADER (elixir-lab-content.xlsx) ============ */
const CONTENT={source:"built-in",problems:[],file:"elixir-lab-content.xlsx"};
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function loadContent(){
 if(!/^https?:$/.test(location.protocol))return;
 let buf;try{const r=await fetch(CONTENT.file,{cache:"no-cache"});if(!r.ok)return;buf=await r.arrayBuffer()}catch(e){return}
 try{if(!window.XLSX)await loadScript("xlsx.mini.min.js")}catch(e){CONTENT.problems.push("Could not load xlsx.mini.min.js – upload it next to index.html.");return}
 try{applyContent(XLSX.read(buf,{type:"array"}))}catch(e){CONTENT.problems.push("Could not read the content file: "+e.message)}
 route()}
function applyContent(wb){
 const P=[],need=n=>{const ws=wb.Sheets[n];if(!ws){P.push(`Sheet “${n}” is missing.`);return []}return XLSX.utils.sheet_to_json(ws,{defval:"",raw:true})};
 const g=(row,pre)=>{const k=Object.keys(row).find(k=>k.trim().toLowerCase().startsWith(pre));return k==null?"":String(row[k]).trim()};
 const lines=s=>String(s).split(/\r?\n/).map(x=>x.trim()).filter(Boolean), list=s=>String(s).split(",").map(x=>x.trim()).filter(Boolean);
 const S=need("Sections"),RR=need("Reagents"),II=need("Ingredients"),TT=need("Tests");
 const sR=[],sT=[];S.forEach((r,i)=>{const id=g(r,"id");if(!id)return;const o={id,ic:g(r,"icon")||"•",n:g(r,"name")||id,d:g(r,"description")};
  const ty=g(r,"type").toLowerCase();if(ty.startsWith("r"))sR.push(o);else if(ty.startsWith("t"))sT.push(o);else P.push(`Sections row ${i+2}: Type must be Reagent or Test.`)});
 const seen=new Set(),dup=(id,where)=>{if(seen.has(id))P.push(`${where}: ID “${id}” is used twice.`);seen.add(id)};
 const ing={};II.forEach((r,i)=>{const rid=g(r,"reagent id");if(!rid)return;const name=g(r,"ingredient");if(!name){P.push(`Ingredients row ${i+2}: Ingredient is empty.`);return}
  let a=g(r,"amount"),u=g(r,"unit"),q=a===""?null:Number(a.replace(",","."));if(q!=null&&isNaN(q)){u=(a+" "+u).trim();q=null}
  const part=g(r,"part"),arr=ing[rid]=ing[rid]||[];let p=arr.find(x=>(x.t||"")===part);if(!p){p={t:part,i:[]};arr.push(p)}
  const it=[name,q,u];if(g(r,"make up").toUpperCase().startsWith("Y"))it.push("to");p.i.push(it)});
 const nR=[];RR.forEach((r,i)=>{const id=g(r,"id");if(!id)return;dup(id,`Reagents row ${i+2}`);const s=g(r,"section");
  if(!sR.some(x=>x.id===s))P.push(`Reagents “${id}”: Section ID “${s}” not found in Sections (Type = Reagent).`);
  if(!ing[id])P.push(`Reagent “${id}” has no rows in Ingredients.`);
  nR.push({id,s,n:g(r,"name")||id,a:g(r,"also"),u:g(r,"used"),y:Number(g(r,"makes"))||0,p:ing[id]||[{t:"",i:[]}],m:lines(g(r,"preparation")),
   t:g(r,"quick"),r:g(r,"positive"),st:g(r,"storage")||"—",h:list(g(r,"hazard")),sf:g(r,"safety"),nt:g(r,"notes")})});
 Object.keys(ing).forEach(k=>{if(!nR.some(r=>r.id===k))P.push(`Ingredients: Reagent ID “${k}” does not exist in Reagents.`)});
 const nT=[],cl={},std=[];TT.forEach((r,i)=>{const id=g(r,"id");if(!id)return;dup(id,`Tests row ${i+2}`);const c=g(r,"section");
  if(!sT.some(x=>x.id===c))P.push(`Test “${id}”: Section ID “${c}” not found in Sections (Type = Test).`);
  const pr=lines(g(r,"procedure"));if(!pr.length)P.push(`Test “${id}” has no procedure steps.`);
  nT.push({id,c,n:g(r,"name")||id,aim:g(r,"aim"),need:list(g(r,"prepare")),ex:lines(g(r,"also needed")),smp:g(r,"sample"),pr,
   pos:g(r,"positive"),neg:g(r,"negative"),ctl:g(r,"controls"),pc:lines(g(r,"precaution"))});
  const d=g(r,"detects");if(d)cl[id]=d;if(g(r,"standard").toUpperCase().startsWith("Y"))std.push(id)});
 nT.forEach(t=>t.need.forEach(x=>{if(!seen.has(x))P.push(`Test “${t.id}”: “Prepare first” ID “${x}” does not exist.`)}));
 if(!nR.length||!nT.length||!sR.length||!sT.length){CONTENT.problems=P.concat(["Content file looks empty – the built-in content is shown instead."]);return}
 SECTIONS.splice(0,SECTIONS.length,...sR);TSECS.splice(0,TSECS.length,...sT);R.splice(0,R.length,...nR);T.splice(0,T.length,...nT);
 Object.keys(CL).forEach(k=>delete CL[k]);Object.assign(CL,cl);
 PRESETS.splice(0,PRESETS.length,{id:"std",n:"Standard phytochemical screening",t:std},
  ...TSECS.filter(s=>T.some(t=>t.c===s.id)&&!T.filter(t=>t.c===s.id).every(t=>!CL[t.id])).map(s=>({id:s.id,n:s.n,t:T.filter(t=>t.c===s.id).map(t=>t.id)})),
  {id:"custom",n:"Custom – pick tests",t:[]});
 if(!std.length)PRESETS.shift();
 CONTENT.source="file";CONTENT.problems=P}
function contentCard(){const p=CONTENT.problems;
 return `<div class="card ${p.length?"safety":""}"><h3>${p.length?ico("warn")+" ":""}Content check</h3>
 Content source: <b>${CONTENT.source==="file"?CONTENT.file:"built into the app"}</b> · ${R.length} reagents · ${T.length} tests.
 ${p.length?`<ul class="pc">${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<div class="res pos" style="margin-top:8px">${ico("check")} No problems found.</div>`}</div>`}

/* ============ ROUTER (hash) ============ */
function route(){const h=location.hash.slice(1);window.scrollTo(0,0);
 if(!h)return home();if(h==="tests")return testsHome();if(h==="search")return search();if(h==="saved")return saved();if(h==="tools")return tools();if(h==="about")return about();if(h==="results")return results();if(h.startsWith("sheet-"))return sheet(h.slice(6));
 if(h.startsWith("ts-"))return tsection(h.slice(3));if(h.startsWith("s-"))return section(h.slice(2));
 if(h.startsWith("r-"))return reagent(h.slice(2));if(h.startsWith("t-"))return test(h.slice(2));home()}
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h}
window.addEventListener("hashchange",route);
document.querySelectorAll("[data-ico]").forEach(e=>e.innerHTML=ico(e.dataset.ico));
$("#back").onclick=()=>{if(history.length>1)history.back();else go("")};
$("#info").onclick=()=>go("about");$("#srch").onclick=()=>go("search");
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.go));
route();
loadContent();
try{if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script>
