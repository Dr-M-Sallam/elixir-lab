<style>
:root{color-scheme:only light;
  --bg:#f5f7f6;--card:#fff;--ink:#1b2b36;--muted:#66737a;--line:#dee4e2;--navy:#142b39;
  --pri:#157a57;--pri2:#e6f3ee;--gold:#f0b938;--char:#3a3937;--warn:#b42318;--warnbg:#fdecea;--amber:#8a5a00;--amberbg:#fff4dc;
  --r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--char);border-bottom:3px solid var(--gold);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
#logo{width:34px;height:34px;border-radius:50%;background:#fff;object-fit:cover;flex:none}
.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:22px}
nav button.on{position:relative}nav button.on::after{content:"";position:absolute;top:-6px;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.brandlogo{display:block;width:120px;height:120px;border-radius:50%;margin:4px auto 10px;background:#fff}
header h1{font-size:18px;margin:0;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:none;border:0;color:#fff;font-size:22px;padding:2px 8px 2px 0;cursor:pointer;display:none}
main{padding:14px 14px 96px;max-width:720px;margin:0 auto}
.search{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);border:1px solid var(--line);cursor:pointer;min-height:104px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:15px;line-height:1.25}
.tile small{color:var(--muted);font-size:12.5px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--sh)}
.item b{display:block;font-size:15.5px}
.item span{color:var(--muted);font-size:13.5px}
.sechead{margin:4px 0 12px}
.sechead p{color:var(--muted);margin:4px 0 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--pri)}
.title{font-size:22px;margin:2px 0 4px;line-height:1.25}
.aka{color:var(--muted);font-size:14px;margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--warnbg);color:var(--warn)}
.tag.ok{background:var(--pri2);color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}

.chips input{width:74px;padding:7px 9px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.q{text-align:right;white-space:nowrap;font-weight:650;padding-left:10px;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.part{font-weight:650;margin:10px 0 2px;font-size:14px;color:var(--muted)}
.part:first-child{margin-top:0}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 38px;border-bottom:1px solid var(--line);cursor:pointer}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--pri2);color:var(--pri);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
ol.steps li.done{color:var(--muted);text-decoration:line-through}
ol.steps li.done::before{content:"✓";background:var(--pri);color:#fff}
.res{background:var(--pri2);border-radius:10px;padding:10px 12px;margin-top:8px}
.safety{background:var(--warnbg);color:var(--ink);border:1px solid transparent}
.safety h3{color:var(--warn)}
.note{background:var(--amberbg)}
.note h3{color:var(--amber)}
.yield{color:var(--muted);font-size:13.5px;margin-top:8px}
.btnrow{display:flex;gap:8px;margin:4px 0 12px}
.btn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px;font-size:14.5px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{background:none;border:0;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 12px;cursor:pointer}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:var(--pri);font-weight:650}
label.f{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.out{margin-top:12px;padding:12px;border-radius:10px;background:var(--pri2);font-size:15px}
.out b{color:var(--pri)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#16211c;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.star{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;display:none}
.item.test{border-left:4px solid var(--pri)}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
.chip.lnk{text-align:left;background:var(--pri2);color:var(--pri);border-color:transparent;font-weight:600}
.mats{margin-top:10px;font-size:14.5px;color:var(--ink)}
.res.pos{background:var(--pri2)}
.res.neg{background:var(--bg);border:1px solid var(--line)}
ul.pc{margin:0;padding-left:20px}ul.pc li{margin:5px 0}
nav button{padding:4px 6px}
.wide{width:100%;flex:none;margin-bottom:14px;padding:13px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--card);color:var(--ink);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.mh{margin:0 0 6px;font-size:18px}
.pick{max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:10px}
label.ck{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
label.ck input{width:20px;height:20px;accent-color:var(--pri)}
.srow{display:flex;gap:6px;margin-bottom:6px}.xbtn{border:1px solid var(--line);background:var(--bg);color:var(--warn);border-radius:10px;width:44px;font-size:16px}
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
table.rs{font-size:14px;min-width:100%}
table.rs th{position:sticky;top:0;background:var(--pri2);color:var(--pri);font-size:12.5px;padding:8px 6px;text-align:left}
table.rs th.sc{text-align:center;min-width:64px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.rs td{padding:8px 6px}
table.rs td.tn{cursor:pointer;min-width:140px}table.rs td.tn small{display:block;color:var(--muted);font-size:12px}
table.rs tr.gh td{background:var(--bg);font-weight:700;font-size:12.5px;color:var(--muted);padding:6px}
td.cell{text-align:center;font-weight:800;font-size:16px;cursor:pointer;border-left:1px solid var(--line);user-select:none}
.cp{color:#0f7a3d}.cn{color:var(--muted)}.cd{color:var(--amber)}
td.cell.cp{background:rgba(15,122,61,.10)}td.cell.cd{background:var(--amberbg)}

.legend{font-size:13px;color:var(--muted);margin:0 2px 12px;display:flex;flex-wrap:wrap;gap:4px 10px}.legend span{font-weight:700}
.sumrow{padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}.sumrow:last-child{border:0}.muted{color:var(--muted)}
.ico{width:1.1em;height:1.1em;vertical-align:-0.18em;flex:none}
.ico.fill{fill:currentColor}
nav button i .ico{width:23px;height:23px;vertical-align:0}
header .star .ico{width:22px;height:22px;vertical-align:-4px}
.tile .ic{color:#ff9f1c;background:var(--pri2);width:46px;height:46px}
.i3d{width:1.3em;height:1.3em;vertical-align:-0.3em;object-fit:contain}.tile .ic .i3d{width:34px;height:34px;vertical-align:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}.tile .ic .ico{width:22px;height:22px;vertical-align:0}
.tag .ico{width:12px;height:12px;vertical-align:-1px}
.card h3 .ico{width:15px;height:15px;vertical-align:-2px}
.xbtn .ico{vertical-align:-3px}
.rimgs{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.rimgs img{height:150px;max-width:85%;border-radius:10px;object-fit:cover;background:#fff;border:1px solid var(--line);cursor:zoom-in;flex:none}
.zoomimg{display:block;width:100%;max-height:70vh;object-fit:contain;border-radius:12px;background:#000}
nav button{padding:4px 2px;font-size:10.5px;flex:1;min-width:0}
.item.atl{display:flex;gap:12px;align-items:center}
.thumb{position:relative;flex:none;width:64px;height:64px;border-radius:10px;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb .ico{width:26px;height:26px}.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.atlimgs img{height:220px}
.ph-card{text-align:center;color:var(--muted)}.ph-card .ico{width:28px;height:28px;display:block;margin:0 auto 6px;color:var(--pri)}
ol.calcsteps{margin:10px 0 0;padding-left:20px;font-size:14.5px;color:var(--muted)}ol.calcsteps li{margin:3px 0}
.pimg{position:relative;flex:none;display:block;cursor:zoom-in;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.pimg img,.thumb img,.zoomimg{pointer-events:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.rimgs .pimg img{display:block}
.pimg{height:150px;width:150px;background:#fff center/cover no-repeat;border-radius:10px;border:1px solid var(--line)}
.atlimgs .pimg{height:220px;width:220px}
.tbg{position:absolute;inset:0;background:center/cover no-repeat}
.zoombg{width:100%;height:70vh;background:#000 center/contain no-repeat;border-radius:12px;-webkit-touch-callout:none;user-select:none}
#splash{position:fixed;inset:0;z-index:1000;background:#122938 center/min(86vw,86vh) no-repeat;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash video{width:min(86vw,86vh);height:min(86vw,86vh);object-fit:contain;background:#122938;pointer-events:none;-webkit-mask-image:radial-gradient(circle closest-side,#000 82%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 82%,transparent 100%)}
#splashskip{position:absolute;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:8px 16px;font-size:14px;cursor:pointer}
/* ===== redesign ===== */
header{background:var(--navy)!important;border-bottom:3px solid var(--gold)!important;padding:12px 16px!important;gap:12px!important;min-height:58px}
body.toplevel header{padding:16px 18px!important}
#logo{width:30px;height:30px}body.toplevel #logo{width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.htxt{flex:1;min-width:0}.htxt h1{flex:none!important}
body.toplevel #hdr{font-size:24px;font-weight:800;letter-spacing:.2px}
#hsub{font-size:13px;color:rgba(255,255,255,.72);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:none;color:#fff;align-items:center;justify-content:center;cursor:pointer;flex:none}
.hbtn .ico{width:20px;height:20px}
.sbar{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 18px;color:var(--muted);font-size:16px;margin:6px 0 16px;cursor:text}
.sbar .ico{width:22px;height:22px;color:var(--muted)}
.start{display:flex;align-items:center;gap:14px;background:#e7f3ef;border:1.5px solid #cfe6dc;border-radius:16px;padding:16px;margin-bottom:24px;cursor:pointer}
.start b{display:block;color:var(--pri);font-size:16.5px}.start small{color:#4e5d63;font-size:14px}
.sic{flex:none;width:44px;height:44px;border-radius:12px;background:#d6ebe2;color:var(--pri);display:flex;align-items:center;justify-content:center}.sic .ico{width:22px;height:22px}
.start>div,.mrow>div{flex:1;min-width:0}.chev{color:var(--pri);flex:none}.chev .ico{width:20px;height:20px}
.ptitle{font-size:22px;margin:4px 0 2px;color:var(--ink);font-weight:800}.psub{margin:0 0 16px;color:var(--muted);font-size:15px}
.grid{gap:12px!important}
.tile{min-height:128px!important;padding:16px!important;gap:6px!important;border:1.5px solid var(--line)!important;box-shadow:none!important;border-radius:16px!important}
.trow{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.tile .ic{width:auto!important;height:auto!important;background:none!important;color:#042433!important;display:block!important}
.tile .ic .ico{width:30px!important;height:30px!important;stroke-width:1.8}
.cnt{font-size:13px;font-weight:700;color:#7c888d}
.tile b{font-size:16px!important;color:var(--ink);line-height:1.25}.tile small{font-size:13.5px!important;color:var(--muted);line-height:1.35}
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer}
.mrow b{display:block;font-size:16px;color:var(--ink)}.mrow small{color:var(--muted);font-size:13.5px}
nav{padding:8px 6px calc(8px + env(safe-area-inset-bottom))!important;border-top:1px solid var(--line)}
nav button{flex:1;font-size:12.5px!important;gap:4px!important;color:#626f77!important;padding:0!important}
nav button i{width:52px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center}
nav button i .ico{width:24px!important;height:24px!important}
nav button.on{color:var(--pri)!important;font-weight:700}nav button.on i{background:#e3f2eb}
nav button.on::after{display:none!important}
.part .ico,.rs .gh .ico{color:var(--pri)}
.gals{padding:12px 14px}.gal+.gal{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.galh{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pri);margin-bottom:8px}
.phline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}.phline .ico{width:18px;height:18px;flex:none}
.latin{font-style:italic;color:var(--ink)}.latin .nl{font-style:normal}
.famlink{color:var(--pri);font-weight:650;text-decoration:underline;cursor:pointer}
.cic{height:1.4em;width:auto;vertical-align:-0.35em}.tile .ic .cic{height:36px;max-width:60px;width:auto;vertical-align:0}.sic .cic{height:26px}
.disc{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.45}
</style>
</head>

const SECTIONS=[
 {id:"mount",ic:"slide",n:"Microscopy – Clearing & Mountants",d:"Clearing & mounting"},

const W="Distilled water";
const R=[
{"id": "chloral", "s": "mount", "n": "Chloral hydrate solution", "a": "Clearing reagent", "u": "Clears sections and powders by dissolving starch, proteins, chlorophyll and resins, so crystals, trichomes, stomata and lignified tissue are seen clearly.", "y": 55, "p": [{"i": [["Chloral hydrate", 50, "g"], ["Distilled water", 20, "mL"]]}], "m": ["Weigh 50 g chloral hydrate into a beaker.", "Add 20 mL distilled water.", "Warm gently on a water bath with stirring until completely dissolved.", "Cool and transfer to a well-closed amber bottle."], "t": "Place the powder or section on a slide, add 2–3 drops, warm gently over a small flame (do not boil dry), add more reagent if needed, then cover with a cover slip.", "r": "Clear, transparent tissue; calcium oxalate crystals, hairs, stomata and vessels become distinct.", "st": "Well-closed amber bottle, room temperature.", "h": ["Toxic", "Irritant"], "sf": "Harmful if swallowed; irritant to skin and eyes. Chloral hydrate is a controlled substance in some countries – keep it locked and logged.", "nt": "Starch grains are destroyed – to examine starch, mount in water or dilute glycerol instead. If crystals form on the slide after cooling, add 1 drop of dilute glycerol. Ph. Eur. uses a stronger version (80 g in 20 mL water)."},
{"id": "glyc50", "s": "mount", "n": "Dilute glycerol (50%)", "a": "Glycerol–water mountant", "u": "General temporary mountant; prevents the preparation drying out. Ideal for starch grains and cell contents.", "y": 100, "p": [{"i": [["Glycerol", 50, "mL"], ["Distilled water", 50, "mL"]]}], "m": ["Measure 50 mL glycerol (it is viscous – pour slowly).", "Add 50 mL distilled water.", "Mix well and bottle."], "t": "Add 1–2 drops to the specimen on the slide and apply a cover slip.", "r": "—", "st": "Closed bottle; add a small crystal of thymol to prevent mould for long storage.", "h": [], "sf": "Low hazard.", "nt": "Good for observing starch, which chloral hydrate would destroy."},
{"id": "glyjelly", "s": "mount", "n": "Glycerin jelly (Kaiser's)", "a": "Glycerol–gelatin", "u": "Semi-permanent mounting medium for sections and powders.", "y": 100, "p": [{"i": [["Gelatin", 7, "g"], ["Distilled water", 42, "mL"], ["Glycerol", 50, "g"], ["Phenol (preservative)", 0.5, "g"]]}], "m": ["Soak the gelatin in the water for about 2 hours until swollen.", "Add the glycerol and phenol.", "Warm on a water bath (60–70 °C) for 10–15 min, stirring gently, until clear.", "Filter while hot through glass wool.", "Pour into small jars; it sets on cooling."], "t": "Melt a small piece on the slide (warm gently), place the specimen in it, cover with a cover slip. Seal the edges with nail varnish for long-term slides.", "r": "—", "st": "Closed jars; re-melt on a warm water bath before use.", "h": ["Toxic", "Corrosive"], "sf": "Phenol is toxic and burns skin – wear gloves; wash immediately with plenty of water if splashed.", "nt": "Avoid bubbles: warm slowly, do not stir vigorously."},
{"id": "lacto", "s": "mount", "n": "Lactophenol (Amann's)", "a": "Lactophenol mountant", "u": "Clearing and mounting medium, especially for fungal material (e.g. ergot) and delicate tissues.", "y": 85, "p": [{"i": [["Phenol (crystals)", 20, "g"], ["Lactic acid", 20, "g"], ["Glycerol", 40, "g"], ["Distilled water", 20, "mL"]]}], "m": ["Dissolve the phenol in the water (warm gently if needed).", "Add lactic acid and glycerol.", "Mix well and store in an amber bottle."], "t": "Mount specimen in 1–2 drops; warm gently for faster clearing.", "r": "Cleared tissue with good preservation of structures.", "st": "Amber bottle, room temperature.", "h": ["Toxic", "Corrosive"], "sf": "Contains phenol – toxic and corrosive. Gloves and goggles.", "nt": "Can add 0.05% cotton blue to stain fungal hyphae (lactophenol cotton blue)."},
{"id": "koh5", "s": "mount", "n": "Potassium hydroxide 5%", "a": "KOH clearing / softening", "u": "Softens and clears tough material (seeds, barks); also used for detecting anthraquinone-containing tissues (turn red).", "y": 100, "p": [{"i": [["Potassium hydroxide (pellets)", 5, "g"], ["Distilled water", 100, "mL", "to"]]}], "m": ["Weigh KOH pellets quickly (they absorb moisture).", "Dissolve in about 70 mL water – the solution gets hot.", "Cool, then make up to the final volume with water.", "Store in a polyethylene or rubber-stoppered bottle."], "t": "Warm the specimen in a few drops, wash with water, then mount.", "r": "Anthraquinone-containing cells/powder turn red to violet-red (e.g. rhubarb, senna).", "st": "Plastic bottle; glass stoppers stick.", "h": ["Corrosive"], "sf": "Corrosive to skin and eyes. Always add KOH to water, never water to solid KOH.", "nt": ""},
{"id": "schultze", "s": "mount", "n": "Schultze's macerating fluid", "a": "KClO₃ + HNO₃ maceration", "u": "Separates lignified cells (fibres, sclereids, vessels, tracheids) for isolated-element examination.", "y": 10, "p": [{"i": [["Nitric acid 50% (v/v)", 10, "mL"], ["Potassium chlorate (crystals)", 0.5, "g"]]}], "m": ["Prepare 50% nitric acid by carefully adding concentrated HNO₃ to an equal volume of water.", "Put small pieces of the drug in a test tube, add the 50% nitric acid.", "Add a few crystals of potassium chlorate.", "Warm GENTLY on a water bath in a fume hood until the tissue softens and gas evolution slows.", "Pour into plenty of water, wash several times, tease apart with needles and mount."], "t": "Mount isolated elements in dilute glycerol or stain with phloroglucinol–HCl.", "r": "Individual fibres, sclereids and vessel elements separated.", "st": "Prepare fresh at the time of use – do not store.", "h": ["Oxidizer", "Corrosive", "Toxic"], "sf": "Strong oxidizing mixture – risk of violent reaction. Fume hood only, small quantities, never heat directly over a flame, never seal the tube. Toxic chlorine oxide fumes.", "nt": "Use only under supervision. Maceration in 5% KOH or chromic acid are alternatives."},
{"id": "phloro", "s": "stain", "n": "Phloroglucinol–HCl", "a": "Lignin test", "u": "Detects lignified walls (xylem vessels, fibres, sclereids, stone cells).", "y": 100, "p": [{"t": "Reagent 1", "i": [["Phloroglucinol", 1, "g"], ["Ethanol 90%", 100, "mL", "to"]]}, {"t": "Reagent 2", "i": [["Hydrochloric acid, concentrated", null, "in dropper bottle"]]}], "m": ["Dissolve phloroglucinol in 90% ethanol.", "Store in an amber dropper bottle.", "Keep conc. HCl in a separate dropper bottle."], "t": "Add 1–2 drops phloroglucinol to the section/powder, wait 1–2 min (allow to almost dry), then add 1 drop conc. HCl and cover.", "r": "Lignified walls → pink to cherry-red.", "st": "Amber bottle; usable for several weeks (discard if brown).", "h": ["Corrosive", "Flammable"], "sf": "Conc. HCl is corrosive and fuming – work carefully; never let it touch the microscope objective.", "nt": "Examine immediately; colour fades and acid damages the stage. Wipe off excess acid."},
{"id": "iodine", "s": "stain", "n": "Iodine solution (dilute)", "a": "Iodine–KI, N/50 iodine", "u": "Detects starch and aleurone grains in sections and powders.", "y": 100, "p": [{"i": [["Potassium iodide", 2, "g"], ["Iodine", 1, "g"], ["Distilled water", 100, "mL", "to"]]}], "m": ["Dissolve KI in about 5 mL water first (iodine only dissolves in concentrated KI).", "Add the iodine and shake until dissolved.", "Dilute to the final volume with water."], "t": "Add 1 drop to the specimen and cover.", "r": "Starch → blue to blue-black. Aleurone grains/proteins → yellow-brown. Lignin → yellow.", "st": "Amber bottle, tightly closed.", "h": ["Irritant"], "sf": "Stains skin and clothes; avoid inhaling iodine vapour.", "nt": "Too dark? Dilute further with water."},
{"id": "lugol", "s": "stain", "n": "Lugol's iodine (strong)", "a": "Lugol's solution", "u": "Stock iodine solution; dilute 1 in 10 for starch staining.", "y": 100, "p": [{"i": [["Potassium iodide", 10, "g"], ["Iodine", 5, "g"], ["Distilled water", 100, "mL", "to"]]}], "m": ["Dissolve KI in about 10 mL water.", "Add iodine; shake until dissolved.", "Dilute to volume."], "t": "Dilute 1:10 with water before use on specimens.", "r": "Starch → blue-black.", "st": "Amber bottle.", "h": ["Irritant"], "sf": "Avoid skin contact and vapour.", "nt": ""},
{"id": "czi", "s": "stain", "n": "Chlor-zinc-iodine", "a": "Schultze's solution", "u": "Distinguishes cellulose walls from lignified/suberized walls.", "y": 25, "p": [{"i": [["Zinc chloride", 20, "g"], ["Potassium iodide", 6.5, "g"], ["Distilled water", 10.5, "mL"], ["Iodine", 0.5, "g"]]}], "m": ["Dissolve zinc chloride and potassium iodide in the water.", "Add the iodine and shake for about 15 minutes.", "Filter through glass wool if necessary."], "t": "Add 1–2 drops to the section, wait 1–2 min, cover.", "r": "Cellulose → blue-violet. Lignified, suberized and cutinized walls → yellow-brown. Starch → blue-black.", "st": "Amber bottle, protected from light; prepare fresh every few weeks.", "h": ["Corrosive", "Irritant"], "sf": "Zinc chloride is corrosive.", "nt": ""},
{"id": "sudan", "s": "stain", "n": "Sudan III solution", "a": "Fat stain", "u": "Detects fixed oils, fats, volatile oil droplets, cutin and suberin.", "y": 10, "p": [{"i": [["Sudan III", 0.01, "g"], ["Ethanol 90%", 5, "mL"], ["Glycerol", 5, "mL"]]}], "m": ["Dissolve Sudan III in the ethanol.", "Add the glycerol and mix.", "Filter if any undissolved dye remains."], "t": "Mount the section in a few drops; warm gently or leave 5–10 min, then examine.", "r": "Oils, fats, cuticle and suberized (cork) walls → orange-red.", "st": "Well-closed amber bottle.", "h": ["Flammable"], "sf": "Flammable (ethanol).", "nt": "Sudan IV or Sudan Black B can be used similarly."},
{"id": "ruth", "s": "stain", "n": "Ruthenium red (0.02%)", "a": "Mucilage stain", "u": "Detects mucilage and pectic substances (e.g. linseed, ispaghula, marshmallow).", "y": 50, "p": [{"i": [["Ruthenium red", 0.01, "g"], ["Distilled water", 50, "mL", "to"]]}], "m": ["Dissolve ruthenium red in water (1 in 5000).", "Prepare fresh in small amounts."], "t": "Mount the dry powder/section directly in the reagent.", "r": "Mucilage and pectin → pink to red.", "st": "Freshly prepared; keep in the dark.", "h": ["Irritant"], "sf": "Low hazard; expensive dye – make small amounts.", "nt": "Mucilage swells in water; for observing mucilage cells in situ mount first in alcohol."},
{"id": "safranin", "s": "stain", "n": "Safranin O 1%", "a": "Safranin", "u": "Stains lignified walls, cutin and nuclei red; used with fast green for double staining.", "y": 100, "p": [{"i": [["Safranin O", 1, "g"], ["Ethanol 50%", 100, "mL", "to"]]}], "m": ["Dissolve safranin in 50% ethanol.", "Filter and store."], "t": "Double staining: stain section in safranin 2–5 min → wash with water → pass through 50%, 70%, 90% ethanol → fast green 30–60 s → absolute ethanol → mount.", "r": "Lignified walls → red; cellulose walls (with fast green) → green.", "st": "Closed bottle, months.", "h": ["Flammable"], "sf": "Stains skin.", "nt": ""},
{"id": "fastgreen", "s": "stain", "n": "Fast green FCF 0.5%", "a": "Counterstain", "u": "Counterstain for cellulose walls and cytoplasm in safranin double staining.", "y": 100, "p": [{"i": [["Fast green FCF", 0.5, "g"], ["Ethanol 95%", 100, "mL", "to"]]}], "m": ["Dissolve dye in ethanol; filter."], "t": "Use for 30–60 s after safranin (see Safranin).", "r": "Cellulose walls → green.", "st": "Closed bottle.", "h": ["Flammable"], "sf": "Flammable.", "nt": "Light green SF can be used instead."},
{"id": "oxalate", "s": "stain", "n": "Crystal identification (Ca oxalate / Ca carbonate)", "a": "Acetic acid, HCl, 66% H₂SO₄", "u": "Confirms the nature of crystals seen in cleared preparations.", "y": 100, "p": [{"t": "Acetic acid 6%", "i": [["Glacial acetic acid", 6, "mL"], ["Distilled water", 100, "mL", "to"]]}, {"t": "Sulfuric acid 66% (v/v)", "i": [["Distilled water", 34, "mL"], ["Sulfuric acid, concentrated", 66, "mL"]]}, {"t": "Dilute HCl", "i": [["see General → Dilute HCl", null, ""]]}], "m": ["Acetic acid: dilute glacial acetic acid with water.", "66% H₂SO₄: place the water in a beaker in an ice bath and add the concentrated acid SLOWLY in small portions with stirring (acid into water – never the reverse)."], "t": "Irrigate the cleared preparation with each reagent under the cover slip and watch the crystals.", "r": "Calcium oxalate: insoluble in acetic acid; soluble in HCl without effervescence; dissolves in 66% H₂SO₄ and needle-shaped calcium sulfate crystals appear. Calcium carbonate (cystoliths): dissolves in acids WITH effervescence.", "st": "Glass bottles.", "h": ["Corrosive"], "sf": "Diluting H₂SO₄ releases strong heat – acid into water, slowly, with cooling. Goggles essential.", "nt": ""},
{"id": "mayer", "s": "alk", "n": "Mayer's reagent", "a": "Potassium mercuric iodide", "u": "General precipitating reagent for alkaloids.", "y": 100, "p": [{"i": [["Mercuric chloride", 1.36, "g"], ["Distilled water (for HgCl₂)", 60, "mL"], ["Potassium iodide", 5, "g"], ["Distilled water (for KI)", 10, "mL"], ["Distilled water", 100, "mL", "to"]]}], "m": ["Dissolve mercuric chloride in 60 mL water.", "Dissolve potassium iodide in 10 mL water.", "Pour the HgCl₂ solution into the KI solution with stirring (the red precipitate formed redissolves).", "Make up to the final volume with water."], "t": "To 1–2 mL of the acidified extract (in dilute HCl or H₂SO₄), add a few drops of reagent.", "r": "Cream / white precipitate → alkaloids present.", "st": "Amber bottle, months.", "h": ["Toxic"], "sf": "Mercury compound – VERY TOXIC and an environmental hazard. Gloves; never pipette by mouth; collect waste for heavy-metal disposal.", "nt": "Proteins also precipitate – use a purified acid extract (alkaloid extraction) to avoid false positives. Confirm with at least two reagents."},
{"id": "wagner", "s": "alk", "n": "Wagner's reagent", "a": "Iodine–potassium iodide", "u": "General precipitating reagent for alkaloids.", "y": 100, "p": [{"i": [["Potassium iodide", 2, "g"], ["Iodine", 1.27, "g"], ["Distilled water", 100, "mL", "to"]]}], "m": ["Dissolve KI in about 5 mL water.", "Add iodine and shake until dissolved.", "Dilute to volume."], "t": "To 1–2 mL acidified extract add a few drops.", "r": "Reddish-brown precipitate → alkaloids.", "st": "Amber bottle.", "h": ["Irritant"], "sf": "Avoid iodine vapour and skin contact.", "nt": ""},
{"id": "drag", "s": "alk", "n": "Dragendorff's reagent (Munier)", "a": "Potassium bismuth iodide", "u": "Most widely used alkaloid reagent – tube test and TLC spray.", "y": 80, "p": [{"t": "Solution A", "i": [["Bismuth subnitrate", 0.85, "g"], ["Glacial acetic acid", 10, "mL"], ["Distilled water", 40, "mL"]]}, {"t": "Solution B", "i": [["Potassium iodide", 8, "g"], ["Distilled water", 20, "mL"]]}], "m": ["Solution A: dissolve bismuth subnitrate in glacial acetic acid, then add water.", "Solution B: dissolve KI in water.", "Stock solution: mix equal volumes of A and B.", "Spray reagent (for TLC): 1 mL stock + 2 mL glacial acetic acid + 10 mL water."], "t": "Tube: add a few drops of stock solution to 1–2 mL acidified extract. TLC: spray the developed, dried plate.", "r": "Orange to orange-red precipitate / orange spots on yellow background → alkaloids.", "st": "Stock: amber bottle in refrigerator, several weeks. Spray solution: prepare fresh.", "h": ["Corrosive", "Irritant"], "sf": "Acetic acid corrosive. Bismuth waste should be collected.", "nt": "Some non-alkaloids (e.g. coumarins, some proteins) can also react – confirm."},
{"id": "hager", "s": "alk", "n": "Hager's reagent", "a": "Saturated picric acid", "u": "Precipitating reagent for alkaloids.", "y": 100, "p": [{"i": [["Picric acid (moist)", 1.2, "g"], ["Distilled water", 100, "mL"]]}], "m": ["Add picric acid to water (saturated ≈ 1.2%).", "Shake well; leave some undissolved excess; filter before use."], "t": "To 1–2 mL acidified extract add a few drops.", "r": "Yellow crystalline precipitate → alkaloids.", "st": "Keep picric acid stock always WET.", "h": ["Explosive", "Toxic"], "sf": "Dry picric acid is EXPLOSIVE (shock/heat sensitive). Never let it dry out on bottle necks or caps. Toxic.", "nt": ""},
{"id": "vitali", "s": "alk", "n": "Vitali–Morin test", "a": "Tropane alkaloids", "u": "Specific colour test for tropane alkaloids (atropine, hyoscyamine, hyoscine – Belladonna, Datura, Hyoscyamus).", "y": 100, "p": [{"t": "Reagents", "i": [["Fuming nitric acid", null, "few drops"], ["Acetone", null, "2–3 mL"]]}, {"t": "Ethanolic KOH 3%", "i": [["Potassium hydroxide", 3, "g"], ["Ethanol 96%", 100, "mL", "to"]]}], "m": ["Prepare ethanolic KOH: dissolve KOH in ethanol (fresh)."], "t": "Evaporate the alkaloid residue with 3–5 drops fuming HNO₃ to dryness on a water bath (fume hood). Cool, dissolve the yellow residue in a little acetone, then add 1 drop ethanolic KOH.", "r": "Violet colour → tropane alkaloid ester.", "st": "Ethanolic KOH: fresh (turns brown).", "h": ["Corrosive", "Oxidizer", "Flammable"], "sf": "Fuming HNO₃ – fume hood only. Acetone flammable.", "nt": ""},
{"id": "murexide", "s": "alk", "n": "Murexide test", "a": "Purine alkaloids", "u": "Caffeine, theobromine, theophylline (tea, coffee, cocoa, kola).", "y": 0, "p": [{"t": "Reagents", "i": [["Potassium chlorate", null, "few crystals"], ["Hydrochloric acid, conc.", null, "1–2 drops"], ["Ammonia solution", null, "vapour"]]}], "m": ["No reagent preparation needed."], "t": "Mix a little residue with a few crystals of KClO₃ and 1–2 drops conc. HCl in a porcelain dish. Evaporate to dryness on a water bath. Expose the residue to ammonia vapour (hold over an open ammonia bottle).", "r": "Reddish/yellow residue turns purple (murexide) with ammonia → purine alkaloids.", "st": "—", "h": ["Oxidizer", "Corrosive"], "sf": "KClO₃ strong oxidizer; HCl fumes. Fume hood.", "nt": ""},
{"id": "thalle", "s": "alk", "n": "Thalleioquin test", "a": "Quinine / quinidine", "u": "Specific for quinine and quinidine (Cinchona bark).", "y": 0, "p": [{"t": "Reagents", "i": [["Bromine water (saturated)", null, "2–3 drops"], ["Dilute ammonia (10%)", null, "excess"]]}], "m": ["No special preparation; use freshly prepared bromine water."], "t": "To 2 mL of a faintly acidic solution of the alkaloid add 2–3 drops bromine water, then excess dilute ammonia.", "r": "Emerald-green colour → quinine/quinidine.", "st": "—", "h": ["Toxic", "Corrosive"], "sf": "Bromine is highly toxic and corrosive – fume hood, gloves.", "nt": "Quinine also shows blue fluorescence in dilute H₂SO₄ under UV 366 nm."},
{"id": "vanurk", "s": "alk", "n": "Van Urk's reagent", "a": "p-DAB / Ehrlich-type", "u": "Ergot (indole) alkaloids.", "y": 100, "p": [{"i": [["Distilled water", 35, "mL"], ["Sulfuric acid, concentrated", 65, "mL"], ["p-Dimethylaminobenzaldehyde", 0.125, "g"], ["Ferric chloride 5%", 0.1, "mL"]]}], "m": ["Add the conc. H₂SO₄ slowly to the water with cooling (ice bath).", "When cool, dissolve the p-DAB.", "Add the ferric chloride solution."], "t": "Add 1–2 mL reagent to 1 mL alkaloid solution (layer or mix).", "r": "Blue to violet-blue colour → ergot/indole alkaloids.", "st": "Use within about 7 days; dark.", "h": ["Corrosive"], "sf": "Strong acid – goggles and gloves.", "nt": ""},
{"id": "molisch", "s": "carb", "n": "Molisch's reagent", "a": "α-Naphthol test", "u": "General test for carbohydrates (and glycosides).", "y": 100, "p": [{"i": [["α-Naphthol", 5, "g"], ["Ethanol 95%", 100, "mL", "to"]]}], "m": ["Dissolve α-naphthol in ethanol.", "Store in amber bottle."], "t": "To 2 mL sample add 2 drops reagent and mix. Incline the tube and pour 1–2 mL conc. H₂SO₄ slowly down the side to form a lower layer. Do not shake.", "r": "Violet / purple ring at the interface → carbohydrate.", "st": "Amber bottle; prepare fresh monthly.", "h": ["Toxic", "Flammable"], "sf": "Conc. H₂SO₄ – pour slowly, point tube away from people.", "nt": "Very sensitive but not specific."},
{"id": "fehling", "s": "carb", "n": "Fehling's solutions A & B", "a": "Fehling's test", "u": "Reducing sugars (glucose, fructose, maltose, lactose).", "y": 1000, "p": [{"t": "Fehling's A", "i": [["Copper(II) sulfate pentahydrate", 34.66, "g"], ["Distilled water", 500, "mL", "to"]]}, {"t": "Fehling's B", "i": [["Potassium sodium tartrate (Rochelle salt)", 173, "g"], ["Sodium hydroxide", 50, "g"], ["Distilled water", 500, "mL", "to"]]}], "m": ["A: dissolve CuSO₄·5H₂O in water and make up to volume.", "B: dissolve Rochelle salt and NaOH in water (heat evolves), cool, make up to volume.", "Store A and B separately; mix equal volumes only immediately before use."], "t": "Mix 1 mL A + 1 mL B, add 1–2 mL sample, heat in boiling water bath 2–5 min.", "r": "Brick-red precipitate (Cu₂O) → reducing sugar.", "st": "Separate bottles (B in plastic/rubber stopper). Stable for months separately.", "h": ["Corrosive", "Irritant"], "sf": "Solution B is strongly alkaline.", "nt": "Sucrose and starch are negative until hydrolysed (boil with dilute HCl, neutralize, then test)."},
{"id": "benedict", "s": "carb", "n": "Benedict's reagent", "a": "Benedict's qualitative", "u": "Reducing sugars – more stable and less alkaline than Fehling's; semi-quantitative.", "y": 1000, "p": [{"i": [["Sodium citrate (trisodium)", 173, "g"], ["Sodium carbonate, anhydrous", 100, "g"], ["Distilled water (warm)", 800, "mL"], ["Copper(II) sulfate pentahydrate", 17.3, "g"], ["Distilled water (for CuSO₄)", 100, "mL"], ["Distilled water", 1000, "mL", "to"]]}], "m": ["Dissolve sodium citrate and sodium carbonate in ~800 mL warm water; filter if needed.", "Dissolve CuSO₄·5H₂O separately in 100 mL water.", "Add the copper solution slowly to the citrate–carbonate solution with constant stirring.", "Make up to the final volume with water."], "t": "To 5 mL reagent add 8 drops (≈0.5 mL) sample; heat in boiling water bath 3–5 min.", "r": "Green → yellow → orange → brick-red precipitate (increasing sugar). Blue = negative.", "st": "Stable for a long time; closed bottle.", "h": ["Irritant"], "sf": "Low-moderate hazard.", "nt": "Tip: use the scaler to make 250 mL (×0.25)."},
{"id": "barfoed", "s": "carb", "n": "Barfoed's reagent", "a": "Monosaccharide test", "u": "Distinguishes reducing monosaccharides from reducing disaccharides.", "y": 200, "p": [{"i": [["Copper(II) acetate", 13.3, "g"], ["Distilled water", 200, "mL"], ["Glacial acetic acid", 1.8, "mL"]]}], "m": ["Dissolve copper acetate in the water (filter if turbid).", "Add glacial acetic acid."], "t": "To 2 mL reagent add 1 mL sample; heat in boiling water bath 2–3 min, then let stand.", "r": "Red precipitate within 2–3 min → monosaccharide. Disaccharides react only after prolonged heating (7–10 min).", "st": "Closed bottle.", "h": ["Irritant"], "sf": "Copper salts harmful if swallowed.", "nt": "Do not over-heat – disaccharides hydrolyse and give false positives."},
{"id": "seliwanoff", "s": "carb", "n": "Seliwanoff's reagent", "a": "Resorcinol–HCl", "u": "Distinguishes ketoses (fructose, sucrose, inulin) from aldoses.", "y": 100, "p": [{"i": [["Resorcinol", 0.05, "g"], ["Distilled water", 67, "mL"], ["Hydrochloric acid, concentrated", 33, "mL"]]}], "m": ["Add the conc. HCl to the water.", "Dissolve resorcinol in the diluted acid."], "t": "To 3 mL reagent add 1 mL sample; heat in boiling water bath for 1 min.", "r": "Cherry-red within 1 min → ketose. Aldoses give faint pink only after longer heating.", "st": "Amber bottle.", "h": ["Corrosive"], "sf": "Acid – gloves and goggles.", "nt": ""},
{"id": "bial", "s": "carb", "n": "Bial's orcinol reagent", "a": "Pentose test", "u": "Pentoses (arabinose, xylose, ribose) – e.g. in gums.", "y": 100, "p": [{"i": [["Orcinol", 0.3, "g"], ["Hydrochloric acid, concentrated", 100, "mL"], ["Ferric chloride 10%", 5, "drops"]]}], "m": ["Dissolve orcinol in conc. HCl.", "Add the ferric chloride solution."], "t": "To 2 mL reagent add 1 mL sample; heat in boiling water bath.", "r": "Blue-green colour → pentose. Hexoses give yellow-brown.", "st": "Amber bottle; fresh.", "h": ["Corrosive"], "sf": "Fuming conc. HCl – fume hood.", "nt": ""},
{"id": "osazone", "s": "carb", "n": "Osazone reagent", "a": "Phenylhydrazine test", "u": "Identifies sugars by the crystal shape of their osazones.", "y": 0, "p": [{"i": [["Phenylhydrazine hydrochloride", 2, "g"], ["Sodium acetate", 3, "g"]]}], "m": ["Grind phenylhydrazine HCl with sodium acetate (2:3) into a uniform powder. Store dry."], "t": "Add ~0.3 g of the mixture to 5 mL sugar solution, heat in boiling water bath 20–30 min, cool slowly, examine crystals under the microscope.", "r": "Glucose/fructose: needle-shaped (broom-like) crystals within ~5 min. Maltose: sunflower-shaped. Lactose: powder-puff/hedgehog.", "st": "Dry, dark, well-closed.", "h": ["Toxic"], "sf": "Phenylhydrazine is toxic and a suspected carcinogen – gloves, fume hood.", "nt": "Sucrose gives no osazone (non-reducing)."},
{"id": "keller", "s": "gly", "n": "Keller–Killiani reagent", "a": "FeCl₃–acetic acid", "u": "2-Deoxysugars of cardiac glycosides (Digitalis, Strophanthus).", "y": 10, "p": [{"i": [["Glacial acetic acid", 10, "mL"], ["Ferric chloride 5%", 1, "drop"]]}], "m": ["Add one drop of 5% ferric chloride to the glacial acetic acid."], "t": "Dissolve the extract residue in 2 mL reagent, transfer to a tube, and carefully underlay with 1 mL conc. H₂SO₄.", "r": "Reddish-brown ring at the interface; the upper acetic acid layer gradually turns blue-green → 2-deoxysugars (cardiac glycosides).", "st": "Prepare fresh.", "h": ["Corrosive"], "sf": "Conc. H₂SO₄ and glacial acetic acid – gloves, goggles.", "nt": ""},
{"id": "kedde", "s": "gly", "n": "Kedde's reagent", "a": "3,5-Dinitrobenzoic acid", "u": "Unsaturated lactone ring of cardenolides (tube & TLC).", "y": 20, "p": [{"t": "Solution A", "i": [["3,5-Dinitrobenzoic acid", 0.2, "g"], ["Methanol", 10, "mL", "to"]]}, {"t": "Solution B (≈1 M KOH)", "i": [["Potassium hydroxide", 0.57, "g"], ["Distilled water", 10, "mL", "to"]]}], "m": ["Prepare A and B separately.", "Mix equal volumes immediately before use."], "t": "Add 1 mL mixed reagent to the methanolic extract. TLC: spray plate.", "r": "Purple / violet (fades) → cardenolides.", "st": "A and B separately; mix fresh.", "h": ["Toxic", "Flammable", "Corrosive"], "sf": "Methanol is toxic and flammable.", "nt": "Bufadienolides do not react."},
{"id": "baljet", "s": "gly", "n": "Baljet's reagent", "a": "Alkaline picrate", "u": "Cardenolides (lactone ring).", "y": 10, "p": [{"i": [["Picric acid 1% (aqueous)", 9, "mL"], ["Sodium hydroxide 10%", 1, "mL"]]}], "m": ["Mix 9 parts 1% picric acid with 1 part 10% NaOH, freshly."], "t": "Add to the extract and observe.", "r": "Orange to orange-red colour → cardenolides.", "st": "Fresh.", "h": ["Explosive", "Toxic", "Corrosive"], "sf": "Keep picric acid stock wet.", "nt": ""},
{"id": "legal", "s": "gly", "n": "Legal's test", "a": "Sodium nitroprusside", "u": "Cardenolides (active methylene of lactone ring).", "y": 5, "p": [{"t": "Sodium nitroprusside 2% (fresh)", "i": [["Sodium nitroprusside", 0.1, "g"], ["Distilled water", 5, "mL", "to"]]}, {"t": "Also needed", "i": [["Pyridine", null, "1 mL"], ["Sodium hydroxide 10%", null, "few drops"]]}], "m": ["Prepare nitroprusside solution fresh (light-sensitive)."], "t": "Dissolve the residue in 1 mL pyridine, add 1–2 drops nitroprusside solution, then make alkaline with 10% NaOH.", "r": "Pink to deep red colour (fades) → cardenolides.", "st": "Fresh only; protect from light.", "h": ["Toxic", "Flammable"], "sf": "Pyridine – fume hood (toxic, bad odour). Nitroprusside toxic.", "nt": ""},
{"id": "born", "s": "gly", "n": "Borntrager's test (& modified)", "a": "Anthraquinones", "u": "Free and combined anthraquinones (senna, cascara, rhubarb, aloe).", "y": 100, "p": [{"t": "Ammonia solution 10%", "i": [["Strong ammonia solution (25%)", 40, "mL"], ["Distilled water", 100, "mL", "to"]]}, {"t": "Also needed", "i": [["Chloroform (or benzene)", null, "5 mL"], ["Dilute sulfuric acid", null, "5 mL"], ["Ferric chloride 5% (modified test)", null, "5 mL"]]}], "m": ["Prepare 10% ammonia: dilute strong ammonia with water (fume hood)."], "t": "Direct (free AQ): shake 0.2 g powder with 5 mL chloroform, filter, add 2 mL 10% ammonia, shake.\nModified (O-glycosides): boil 0.2 g powder with 5 mL dilute H₂SO₄ 2–3 min, filter hot, cool, shake with chloroform, separate, add ammonia.\nModified (C-glycosides, e.g. aloin): boil with 5% FeCl₃ + dilute HCl, then extract and test as above.", "r": "Rose-pink to red colour in the ammoniacal (upper) layer → anthraquinones.", "st": "Ammonia: tightly closed, cool.", "h": ["Toxic", "Corrosive"], "sf": "Chloroform is toxic – fume hood. Benzene is carcinogenic; prefer chloroform or ethyl acetate.", "nt": ""},
{"id": "picrate", "s": "gly", "n": "Sodium picrate paper (Guignard)", "a": "Cyanogenic glycoside test", "u": "Detects HCN released from cyanogenic glycosides (bitter almond, cherry laurel, linseed).", "y": 100, "p": [{"t": "Picric acid 1%", "i": [["Picric acid (moist)", 1, "g"], ["Distilled water", 100, "mL", "to"]]}, {"t": "Sodium carbonate 10%", "i": [["Sodium carbonate", 10, "g"], ["Distilled water", 100, "mL", "to"]]}], "m": ["Dip strips of filter paper in 1% picric acid and let dry.", "Just before use, dip the strip in 10% sodium carbonate."], "t": "Place the crushed, moistened drug (a few drops of water, ± 1 drop chloroform) in a test tube. Suspend the moist picrate paper above it from the stopper (not touching). Stopper and warm at ~37 °C for 15–60 min.", "r": "Yellow paper turns orange → brick-red → HCN released.", "st": "Store dried picrate strips in a closed jar, away from heat.", "h": ["Explosive", "Toxic"], "sf": "HCN is extremely toxic – keep tube stoppered, open in fume hood. Never let picric acid dry as a bulk solid.", "nt": ""},
