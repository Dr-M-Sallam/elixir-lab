{"id": "t_molisch", "c": "carb", "n": "Molisch's test", "aim": "General test for all carbohydrates (free or combined).", "need": ["molisch"], "ex": ["Test tubes", "Conc. H₂SO₄"], "smp": "2 mL aqueous extract or sugar solution.", "pr": ["Add 2 drops Molisch's reagent to 2 mL sample; mix.", "Incline the tube and carefully pour 1–2 mL conc. H₂SO₄ down the side so it forms a lower layer.", "Do not shake; observe the interface."], "pos": "Violet/purple ring at the junction of the two layers.", "neg": "No violet ring (a green ring may appear from reagent alone).", "ctl": "Glucose 1% (positive) and water (blank).", "pc": ["Very sensitive but non-specific: glycosides and some other compounds also react.", "Excess reagent gives a green ring – use only 2 drops.", "Pour acid slowly with tube pointed away from people; heat is generated."]},
{"id": "t_fehling", "c": "carb", "n": "Fehling's test", "aim": "Reducing sugars.", "need": ["fehling"], "ex": ["Boiling water bath", "Test tubes"], "smp": "2 mL aqueous extract or sugar solution.", "pr": ["Mix 1 mL Fehling's A + 1 mL Fehling's B (deep blue).", "Add 2 mL sample.", "Heat in a boiling water bath for 2–5 min."], "pos": "Green → yellow → brick-red precipitate (Cu₂O).", "neg": "Solution stays clear blue.", "ctl": "Glucose 1% (positive), sucrose 1% (negative).", "pc": ["Mix A and B only at the time of use.", "Sucrose and starch are negative – hydrolyse first (see non-reducing sugar test).", "Strongly coloured extracts mask the colour – decolorize with charcoal or dilute.", "Solution B is caustic."]},
{"id": "t_bened", "c": "carb", "n": "Benedict's test", "aim": "Reducing sugars (semi-quantitative).", "need": ["benedict"], "ex": ["Boiling water bath"], "smp": "0.5 mL (8 drops) sample.", "pr": ["Put 5 mL Benedict's reagent in a tube.", "Add 8 drops of sample and mix.", "Heat in boiling water bath for 3–5 min; let cool."], "pos": "Green (trace) → yellow → orange → brick-red (large amount).", "neg": "Remains blue.", "ctl": "Glucose 1% and water.", "pc": ["Ratio matters: too much sample gives false strong colours.", "Ascorbic acid and other reducing agents can give false positives."]},
{"id": "t_barf", "c": "carb", "n": "Barfoed's test", "aim": "Distinguish monosaccharides from reducing disaccharides.", "need": ["barfoed"], "ex": ["Boiling water bath", "Timer"], "smp": "1 mL sugar solution.", "pr": ["Add 1 mL sample to 2 mL Barfoed's reagent.", "Heat in a boiling water bath for exactly 2–3 min.", "Remove and let stand; observe the bottom of the tube."], "pos": "Red precipitate within 2–3 min → monosaccharide (glucose, fructose).", "neg": "No ppt in 3 min → disaccharide (maltose, lactose) or non-reducing sugar.", "ctl": "Glucose and maltose side by side.", "pc": ["Heating longer than ~5 min hydrolyses disaccharides → false positive.", "Use a timer and run the controls in parallel."], "pi": ["t_barf-positive.jpg", "t_barf-positive-2.jpg", "t_barf-positive-3.jpg"]},
{"id": "t_selw", "c": "carb", "n": "Seliwanoff's test", "aim": "Ketoses (fructose; sucrose and inulin after hydrolysis in situ).", "need": ["seliwanoff"], "ex": ["Boiling water bath", "Timer"], "smp": "1 mL sugar solution.", "pr": ["Add 1 mL sample to 3 mL Seliwanoff's reagent.", "Heat in a boiling water bath for 1 min (max 2 min)."], "pos": "Cherry-red within 1 min → ketose.", "neg": "No colour or faint pink after longer heating → aldose.", "ctl": "Fructose and glucose side by side.", "pc": ["Prolonged heating converts glucose too → false positive.", "Concentrated sugar solutions give misleading colours – use ~1%."]},
{"id": "t_bial", "c": "carb", "n": "Bial's test", "aim": "Pentoses (e.g. arabinose in gums).", "need": ["bial"], "ex": ["Boiling water bath"], "smp": "1 mL hydrolysed sample.", "pr": ["Add 1 mL sample to 2 mL Bial's reagent.", "Heat in a boiling water bath until colour develops (1–2 min)."], "pos": "Blue-green colour → pentose.", "neg": "Yellow-brown → hexoses.", "ctl": "Arabinose or xylose.", "pc": ["Conc. HCl – fume hood.", "Polysaccharides (gums) must be hydrolysed first (boil with dilute acid)."]},
{"id": "t_iod", "c": "carb", "n": "Iodine test for starch", "aim": "Starch, dextrins, glycogen in solution.", "need": ["iodine"], "ex": ["Test tubes", "Water bath"], "smp": "2 mL aqueous extract (cooled).", "pr": ["Add 1–2 drops iodine solution to 2 mL cooled sample.", "Optional: heat the blue solution, then cool again."], "pos": "Blue-black → starch (colour disappears on heating and returns on cooling). Red-brown → dextrins or glycogen.", "neg": "Yellow (colour of iodine).", "ctl": "1% starch solution.", "pc": ["Test must be done cold.", "Strongly acidic or alkaline solutions give weak results – neutralize first."], "pi": ["t_iod-positive.jpg", "t_iod-positive-2.jpg", "t_iod-positive-3.jpg"]},
{"id": "t_nonred", "c": "carb", "n": "Test for non-reducing sugars (sucrose)", "aim": "Detect sucrose / non-reducing sugars after hydrolysis.", "need": ["fehling", "dhcl", "naoh10"], "ex": ["Boiling water bath", "Litmus paper"], "smp": "2 mL sample that is NEGATIVE with Fehling's.", "pr": ["Add 1 mL dilute HCl to 2 mL sample.", "Heat in a boiling water bath for 5 min (hydrolysis).", "Cool and neutralize with 10% NaOH (check with litmus).", "Perform Fehling's test on the hydrolysate."], "pos": "Brick-red ppt after hydrolysis (but not before) → non-reducing sugar.", "neg": "No ppt.", "ctl": "Sucrose 1%.", "pc": ["Neutralization is essential – excess acid destroys the Fehling's reagent.", "Always confirm the sample was negative before hydrolysis."]},
{"id": "t_osaz", "c": "carb", "n": "Osazone formation", "aim": "Identify reducing sugars by osazone crystal shape.", "need": ["osazone"], "ex": ["Boiling water bath", "Microscope"], "smp": "5 mL sugar solution (~1%).", "pr": ["Add ~0.3 g osazone mixture to 5 mL sample; dissolve.", "Heat in boiling water bath for 20–30 min, noting the time crystals appear.", "Cool slowly; examine crystals under the microscope."], "pos": "Glucose/fructose: needle (broom/sheaf) crystals in ~5 min (hot). Maltose: sunflower-shaped. Lactose: powder-puff/hedgehog (form on cooling).", "neg": "No crystals (sucrose – non-reducing).", "ctl": "", "pc": ["Phenylhydrazine is toxic and a suspected carcinogen – gloves, fume hood.", "Cool slowly; rapid cooling gives poorly formed crystals."]},
{"id": "t_alk", "c": "alk", "n": "General screening for alkaloids", "aim": "Detect alkaloids with precipitating reagents.", "need": ["p_acid", "mayer", "wagner", "drag", "hager"], "ex": ["Test tubes (5)", "Droppers"], "smp": "Acid extract (see Extract preparation).", "pr": ["Put 1 mL of the clear acid extract into each of 5 tubes.", "Tube 1: keep as blank (no reagent).", "Tube 2: add 2–3 drops Mayer's reagent.", "Tube 3: add 2–3 drops Wagner's reagent.", "Tube 4: add 2–3 drops Dragendorff's reagent.", "Tube 5: add 2–3 drops Hager's reagent.", "Compare each tube with the blank against a dark/light background."], "pos": "Mayer's: cream/white ppt. Wagner's: reddish-brown ppt. Dragendorff's: orange to orange-red ppt. Hager's: yellow ppt.", "neg": "No precipitate (same as blank).", "ctl": "Known positive drug (e.g. cinchona, belladonna) and a reagent blank.", "pc": ["Conclude 'alkaloids present' only if ≥2–3 reagents are positive.", "False positives: proteins, tannins, coumarins, some glycosides – use a purified acid extract.", "Extract must be acidic; in neutral solution alkaloid bases may not precipitate.", "Caffeine and some purine alkaloids do not precipitate with Mayer's – use murexide test.", "Mayer's contains mercury – collect waste separately."]},
{"id": "t_vitali", "c": "alk", "n": "Vitali–Morin test (tropane alkaloids)", "aim": "Specific for hyoscyamine/atropine and hyoscine.", "need": ["vitali"], "ex": ["Porcelain dish", "Water bath"], "smp": "Purified alkaloid residue (from chloroform extract evaporated to dryness).", "pr": ["Add 3–5 drops fuming nitric acid to the residue in a porcelain dish.", "Evaporate to dryness on a water bath in the fume hood.", "Cool; dissolve the yellow residue in 1–2 mL acetone.", "Add 1–2 drops 3% ethanolic KOH."], "pos": "Violet colour → tropane ester alkaloids.", "neg": "No violet colour.", "ctl": "Atropine sulfate as positive.", "pc": ["Fuming HNO₃ – fume hood, gloves, goggles.", "Residue must be completely dry before adding acetone.", "Strychnine and some other alkaloids give interfering colours – use purified extract."]},
{"id": "t_murex", "c": "alk", "n": "Murexide test (purine alkaloids)", "aim": "Caffeine, theobromine, theophylline.", "need": ["murexide"], "ex": ["Porcelain dish", "Water bath"], "smp": "Small amount of residue or powdered tea/coffee/cocoa extract residue.", "pr": ["Mix the residue with a few crystals of potassium chlorate.", "Add 1–2 drops conc. HCl.", "Evaporate to dryness on a water bath.", "Invert the dish over an open bottle of ammonia (or add a drop of dilute ammonia)."], "pos": "Residue turns purple (murexide) → purine alkaloids.", "neg": "No purple colour.", "ctl": "Caffeine as positive.", "pc": ["KClO₃ is a strong oxidizer – small amounts only, keep away from organic matter in bulk.", "Fume hood (chlorine, HCl, NH₃ vapours)."]},
{"id": "t_thal", "c": "alk", "n": "Thalleioquin test (quinine)", "aim": "Quinine and quinidine (Cinchona).", "need": ["thalle", "nh3"], "ex": ["Test tube", "UV lamp 366 nm (optional)"], "smp": "2 mL faintly acidic solution of the alkaloid.", "pr": ["Add 2–3 drops bromine water to 2 mL of the solution.", "Add excess 10% ammonia."], "pos": "Emerald-green colour → quinine/quinidine.", "neg": "No green colour.", "ctl": "Quinine sulfate.", "pc": ["Bromine is very toxic – fume hood, gloves.", "Too much bromine destroys the colour – use only a few drops.", "Supporting test: quinine shows blue fluorescence in dilute H₂SO₄ under UV 366 nm."]},
{"id": "t_qfluor", "c": "alk", "n": "Fluorescence test (quinine)", "aim": "Quinine and quinidine (Cinchona) – blue fluorescence in oxygenated acids.", "need": ["dh2so4", "dhcl"], "ex": ["Two test tubes", "UV lamp 366 nm (optional) or daylight against a dark background"], "smp": "Dilute solution of the alkaloid (or acid extract of cinchona bark) in dilute H₂SO₄.", "pr": ["Tube 1: dissolve a trace of quinine (or a few mL of cinchona acid extract) in dilute sulfuric acid.", "Tube 2 (control): dilute sulfuric acid only.", "Observe both tubes in daylight against a dark background, or under UV 366 nm.", "Confirm: add a few drops of dilute HCl to tube 1 – the fluorescence disappears."], "pos": "Intense blue fluorescence in tube 1 (control stays colourless) → quinine / quinidine.", "neg": "No blue fluorescence (like the control).", "ctl": "Dilute H₂SO₄ alone as a blank; quinine sulfate as a positive.", "pc": ["Use H₂SO₄ (or another oxygen acid) – halide ions (HCl, chloride) quench the fluorescence.", "Very dilute solutions fluoresce best; strong solutions may look yellowish.", "Never look directly at the UV lamp – use UV-protective glasses."], "pi": ["t_qfluor-positive.jpg", "t_qfluor-positive-2.jpg"], "ni": ["t_qfluor-negative.jpg"]},
{"id": "t_vanurk", "c": "alk", "n": "Van Urk test (ergot alkaloids)", "aim": "Ergot / indole alkaloids.", "need": ["vanurk"], "ex": ["Test tube"], "smp": "1 mL alkaloid solution.", "pr": ["Add 1–2 mL Van Urk's reagent to 1 mL of the solution and mix carefully."], "pos": "Blue to violet-blue colour.", "neg": "No blue colour.", "ctl": "", "pc": ["Reagent is concentrated acid – goggles.", "Use reagent within 7 days."]},
{"id": "t_shin", "c": "flav", "n": "Shinoda test", "aim": "Flavonoids (flavones, flavonols, flavanones).", "need": ["shinoda", "p_eth"], "ex": ["Magnesium turnings", "Conc. HCl"], "smp": "2 mL ethanolic extract.", "pr": ["Add a few magnesium turnings to 2 mL extract.", "Add conc. HCl dropwise (5–6 drops).", "Wait for effervescence to stop; observe colour."], "pos": "Pink, red, crimson or magenta → flavonoids.", "neg": "No colour change (chalcones/aurones/isoflavones may be negative).", "ctl": "Rutin or quercetin.", "pc": ["H₂ gas forms – no flames nearby.", "Red anthocyanin pigments in the extract give a false positive – check the extract colour + HCl without Mg as blank."]},
{"id": "t_alk_fl", "c": "flav", "n": "Alkaline reagent test", "aim": "Flavonoids.", "need": ["naoh10", "dhcl"], "ex": ["Test tubes"], "smp": "2 mL extract.", "pr": ["Add a few drops 10% NaOH to the extract.", "Then add dilute HCl dropwise."], "pos": "Intense yellow with NaOH that becomes colourless with dilute acid → flavonoids.", "neg": "No yellow colour.", "ctl": "", "pc": ["Other phenolics and chlorophyll may also change colour – use as a supportive test."]},
{"id": "t_alcl", "c": "flav", "n": "Aluminium chloride test", "aim": "Flavonoids (especially flavones and flavonols).", "need": ["alcl3"], "ex": ["UV lamp 366 nm"], "smp": "Ethanolic extract.", "pr": ["Add a few drops 1% AlCl₃ to 2 mL extract, or spot extract on filter paper/TLC and spray.", "Observe in daylight and under UV 366 nm."], "pos": "Yellow colour; intense yellow fluorescence under UV.", "neg": "No yellow/fluorescence.", "ctl": "Quercetin.", "pc": ["Never look directly at UV lamp – use UV goggles."]},
{"id": "t_h2so4fl", "c": "flav", "n": "Sulfuric acid test", "aim": "Flavonoids – indicates the flavonoid class.", "need": ["p_eth"], "ex": ["Conc. H₂SO₄", "Porcelain dish or test tube"], "smp": "Ethanolic extract or its dry residue.", "pr": ["Place a little dry residue (or 1 mL extract) in a dish/tube.", "Add 2–3 drops conc. H₂SO₄ carefully.", "Observe the colour immediately."], "pos": "Yellow to orange → flavones/flavonols. Orange to crimson → flavanones. Red to purple → chalcones/aurones.", "neg": "No characteristic colour (only charring).", "ctl": "Quercetin or rutin.", "pc": ["Conc. H₂SO₄ – goggles, add dropwise.", "Chlorophyll and other pigments char brown – decolorize the extract or use a residue from a cleaned extract.", "Supportive test; confirm with Shinoda / AlCl₃."]},
{"id": "t_born", "c": "anth", "n": "Borntrager's test (free anthraquinones)", "aim": "Free anthraquinone aglycones.", "need": ["born"], "ex": ["Chloroform", "Separating funnel / test tube"], "smp": "0.2 g powdered drug.", "pr": ["Shake 0.2 g powder with 5 mL chloroform for 5 min.", "Filter.", "Add 2 mL 10% ammonia to the filtrate and shake."], "pos": "Rose-pink to red colour in the ammoniacal (upper) layer.", "neg": "Ammonia layer stays colourless.", "ctl": "Rhubarb or cascara.", "pc": ["Most anthraquinones in senna/cascara are glycosides → use the modified test.", "Chloroform is toxic – fume hood.", "Avoid benzene (carcinogenic)."]},
{"id": "t_bornm", "c": "anth", "n": "Modified Borntrager's test (O- & C-glycosides)", "aim": "Anthraquinone glycosides after hydrolysis.", "need": ["born", "dh2so4", "fecl3", "dhcl"], "ex": ["Water bath", "Chloroform"], "smp": "0.2 g powdered drug.", "pr": ["O-glycosides (senna, rhubarb, cascara): boil 0.2 g powder with 5 mL dilute H₂SO₄ for 2–3 min.", "C-glycosides (aloe – aloin): boil 0.2 g powder with 5 mL 5% FeCl₃ + 5 mL dilute HCl for ~5 min (oxidative hydrolysis).", "Filter while hot; cool the filtrate.", "Shake with 5 mL chloroform; separate the chloroform layer.", "Add 2 mL 10% ammonia to the chloroform layer and shake."], "pos": "Pink to red ammoniacal layer → anthraquinone glycosides.", "neg": "No pink colour.", "ctl": "Senna leaf (O-glycoside), aloe (C-glycoside).", "pc": ["C-glycosides (aloin) are NOT hydrolysed by acid alone – FeCl₃ is required.", "Filter hot – anthraquinones may precipitate on cooling.", "Fume hood for chloroform and ammonia."]},
{"id": "t_kohaq", "c": "anth", "n": "Potassium hydroxide test", "aim": "Anthraquinones directly on the drug powder or section.", "need": ["koh5"], "ex": ["Slide or watch glass"], "smp": "Powdered drug (senna, rhubarb, cascara, frangula, aloe).", "pr": ["Place a little powder on a slide or watch glass.", "Add 1–2 drops 5% KOH.", "Observe the colour (with a lens or microscope)."], "pos": "Red to violet-red colour → anthraquinones (free or combined).", "neg": "No red colour.", "ctl": "Rhubarb powder.", "pc": ["Reduced forms (anthrones, anthranols) in fresh material react weakly – old/oxidized drug reacts better.", "KOH is corrosive."]},
{"id": "t_lb", "c": "ster", "n": "Liebermann–Burchard test", "aim": "Steroids and triterpenoids (sterols, saponin and cardiac aglycones); distinguishes steroids (blue-green) from triterpenoids (pink-purple).", "need": ["lb", "p_eth"], "ex": ["Dry test tube", "Ice bath"], "smp": "Completely dry residue of chloroform or ethanolic extract.", "pr": ["Dissolve the residue in 2 mL chloroform.", "Add 1 mL acetic anhydride; mix and cool in ice.", "Add 2–3 drops conc. H₂SO₄ carefully down the side.", "Observe colour changes over 5 min."], "pos": "Red → violet → blue → green. Blue-green = steroids (sterols, steroidal saponins). Pink-red/purple = triterpenoids.", "neg": "No colour change (or only brown charring).", "ctl": "Cholesterol or β-sitosterol.", "pc": ["Moisture spoils the test – use dry glassware and dry residue.", "Chlorophyll gives a green colour – remove it (charcoal or petroleum ether extract) or use a blank.", "Acetic anhydride is corrosive and lachrymatory – fume hood."]},
{"id": "t_salk", "c": "ster", "n": "Salkowski test", "aim": "Sterols and triterpenoids.", "need": ["salk", "p_eth"], "ex": ["Test tube"], "smp": "Dry residue in chloroform.", "pr": ["Dissolve residue in 2 mL chloroform.", "Carefully add 2 mL conc. H₂SO₄ down the side to form a lower layer.", "Do not shake; observe both layers."], "pos": "Red to reddish-brown chloroform (upper) layer; acid layer with yellow-green fluorescence → sterols. Golden-yellow → triterpenes.", "neg": "No red colour.", "ctl": "Cholesterol.", "pc": ["Conc. H₂SO₄ – add slowly; heat evolves.", "Use a white background to read colours."]},
{"id": "t_keller", "c": "card", "n": "Keller–Killiani test", "aim": "2-Deoxysugars (digitoxose) of cardiac glycosides.", "need": ["keller", "p_eth"], "ex": ["Porcelain dish", "Conc. H₂SO₄"], "smp": "Dry residue of ethanolic extract (or chloroform extract after lead acetate cleanup).", "pr": ["Dissolve the residue in 2 mL Keller–Killiani reagent (FeCl₃–acetic acid).", "Transfer to a dry test tube.", "Incline the tube and carefully underlay 1 mL conc. H₂SO₄ down the side."], "pos": "Reddish-brown ring at the interface; upper layer slowly becomes blue-green.", "neg": "No reddish-brown ring / no blue-green.", "ctl": "Digitalis leaf extract.", "pc": ["Do not shake.", "Glassware must be dry.", "The test is for 2-deoxysugars – cardiac glycosides without them (e.g. some Strophanthus) can be negative."]},
{"id": "t_kedde", "c": "card", "n": "Kedde test", "aim": "Five-membered unsaturated lactone of cardenolides.", "need": ["kedde"], "ex": ["Test tube"], "smp": "Methanolic/ethanolic extract.", "pr": ["Mix equal volumes of Kedde's A and B.", "Add 1 mL of the mixture to 1 mL extract."], "pos": "Purple to violet colour (fades).", "neg": "No violet colour.", "ctl": "Digitalis extract.", "pc": ["Observe immediately – colour fades.", "Bufadienolides (squill) are negative.", "Methanol toxic."]},
{"id": "t_baljet", "c": "card", "n": "Baljet test", "aim": "Cardenolide lactone ring.", "need": ["baljet"], "ex": ["Test tube"], "smp": "Extract or thin section.", "pr": ["Add a few drops of freshly mixed Baljet's reagent to the extract or section."], "pos": "Orange to orange-red colour.", "neg": "Yellow (colour of picrate).", "ctl": "", "pc": ["Picric acid: explosive when dry – keep stocks wet.", "Not highly specific – confirm with Kedde/Keller–Killiani."]},
{"id": "t_legal", "c": "card", "n": "Legal's test", "aim": "Cardenolides.", "need": ["legal", "naoh10"], "ex": ["Pyridine", "Test tube"], "smp": "Dry extract residue.", "pr": ["Dissolve the residue in 1 mL pyridine.", "Add 1–2 drops fresh 2% sodium nitroprusside.", "Make alkaline with a few drops 10% NaOH."], "pos": "Pink to blood-red colour (fades).", "neg": "No red colour.", "ctl": "", "pc": ["Pyridine: fume hood.", "Nitroprusside must be freshly prepared and protected from light."]},
{"id": "t_froth", "c": "sap", "n": "Froth (foam) test for saponins", "aim": "Saponins.", "need": ["froth", "p_aq"], "ex": ["Graduated test tube with stopper", "Ruler"], "smp": "Aqueous extract of 0.5–1 g drug (cooled, filtered).", "pr": ["Put 10 mL of the cooled aqueous extract in a graduated test tube.", "Stopper and shake vigorously for 15 seconds.", "Let stand and measure froth height after 10–15 min."], "pos": "Honeycomb froth ≥1 cm persisting 10–15 min → saponins.", "neg": "Froth collapses within a few minutes.", "ctl": "Quillaja or glycyrrhiza.", "pc": ["Proteins and some other compounds give transient froth – persistence is the key.", "Confirm with haemolysis test or Liebermann–Burchard on the aglycone.", "Froth index (quantitative) uses serial dilutions – this is the qualitative version."]},
{"id": "t_haemo", "c": "sap", "n": "Haemolysis test", "aim": "Saponins – lysis of red blood cells.", "need": ["blood2", "saline"], "ex": ["Test tubes", "Blood agar plate (alternative)"], "smp": "Extract of the drug prepared in normal saline (isotonic).", "pr": ["Tube 1 (test): 1 mL saline extract + 1 mL 2% blood suspension.", "Tube 2 (control): 1 mL saline + 1 mL blood suspension.", "Mix gently; leave 30 min at room temperature.", "Compare: haemolysed tube is clear red with no cell sediment.", "Plate method: place a drop of extract on blood agar and incubate – a clear zone forms around saponin-containing extracts."], "pos": "Clear red solution (no sediment) / clear haemolytic zone → saponins.", "neg": "Turbid suspension; cells settle like the control.", "ctl": "Saponin solution (e.g. quillaja) as positive; saline as negative.", "pc": ["Extract MUST be isotonic (in 0.9% saline) – water alone lyses cells (false positive).", "Other substances (some acids, solvents, tannins) can cause haemolysis – confirm with froth test.", "Blood is a biohazard – gloves, disinfect waste."]},
{"id": "t_sapab", "c": "sap", "n": "Steroidal vs triterpenoid saponins (froth in acid & alkali)", "aim": "Distinguish steroidal from triterpenoid saponins.", "need": ["hcl01", "naoh01", "p_aq"], "ex": ["2 equal stoppered test tubes"], "smp": "Aqueous extract that gave a positive froth test.", "pr": ["Tube 1: 5 mL 0.1 M HCl. Tube 2: 5 mL 0.1 M NaOH.", "Add the same number of drops (2–3) of the extract to each tube.", "Stopper and shake both tubes equally and vigorously for 15 s.", "Compare the froth height in the two tubes."], "pos": "Froth equal in both tubes → triterpenoid saponins. Froth in the alkaline tube several times higher than in the acid tube → steroidal saponins.", "neg": "No persistent froth in either tube.", "ctl": "Glycyrrhiza or quillaja (triterpenoid).", "pc": ["Shake both tubes identically (same time, same force).", "Use equal tube sizes and equal volumes.", "Confirm with Liebermann–Burchard (blue-green = steroidal, pink-red = triterpenoid)."]},
{"id": "t_fecl3", "c": "tan", "n": "Ferric chloride test", "aim": "Phenolics and tannins; tannin type.", "need": ["fecl3", "p_aq"], "ex": ["Test tubes"], "smp": "2 mL aqueous or ethanolic extract.", "pr": ["Add 2–3 drops 5% FeCl₃ to 2 mL extract."], "pos": "Blue-black → hydrolysable (gallic) tannins. Green-black → condensed (catechol) tannins / phenolics.", "neg": "No change (yellow-orange of reagent).", "ctl": "Tannic acid 0.5%.", "pc": ["Non-specific: any phenolic OH reacts – confirm tannins with gelatin test.", "Excess reagent masks colour – add dropwise.", "Very dilute extracts give only faint colour."]},
{"id": "t_gel", "c": "tan", "n": "Gelatin–salt test", "aim": "Confirm true tannins (they precipitate proteins).", "need": ["gelatin", "p_aq"], "ex": ["Test tubes"], "smp": "2 mL aqueous extract.", "pr": ["Add a few drops of gelatin–salt reagent to 2 mL extract.", "Mix and observe."], "pos": "White precipitate → tannins.", "neg": "No precipitate (simple phenolics such as gallic acid don't precipitate).", "ctl": "Tannic acid 0.5%.", "pc": ["Gelatin reagent spoils – keep refrigerated, renew weekly.", "A salt-only blank (10% NaCl) rules out salting-out of other compounds."]},
{"id": "t_lead", "c": "tan", "n": "Lead acetate test", "aim": "Tannins (and other phenolics such as flavonoids) – supportive test.", "need": ["leadac", "p_aq"], "ex": ["Test tubes"], "smp": "2 mL extract.", "pr": ["Add a few drops 10% lead acetate to the extract."], "pos": "White, yellow or buff precipitate.", "neg": "No precipitate.", "ctl": "", "pc": ["Lead is toxic – gloves; collect waste.", "Many compounds (acids, proteins, gums) also precipitate – supportive test only."]},
{"id": "t_match", "c": "tan", "n": "Catechin (matchstick) test", "aim": "Catechins / condensed tannins.", "need": ["p_aq"], "ex": ["Wooden matchstick", "Conc. HCl", "Flame"], "smp": "Aqueous or alcoholic extract.", "pr": ["Dip a wooden matchstick in the extract and let it dry.", "Moisten the stick with conc. HCl.", "Warm it near (not in) a flame."], "pos": "Wood turns pink to red → catechins (react with lignin of the wood).", "neg": "No pink colour.", "ctl": "Catechu or green tea extract.", "pc": ["Conc. HCl – do not let acid drip; hold the stick with forceps.", "Do not ignite the stick."]},
{"id": "t_trim", "c": "irid", "n": "Trim & Hill test", "aim": "Iridoids (aucubin-type).", "need": ["trimhill"], "ex": ["Test tube", "Flame or boiling water bath"], "smp": "0.1–0.5 g fresh or dried, crushed plant material (e.g. Plantago leaf).", "pr": ["Place the plant material in a test tube.", "Add 2–5 mL Trim & Hill reagent.", "Heat for a few seconds over a flame (or 1–2 min in a boiling water bath).", "Observe the colour of the liquid."], "pos": "Blue, blue-green or violet colour → iridoids.", "neg": "No blue colour (yellow/brown only).", "ctl": "Plantago leaf (positive).", "pc": ["Not all iridoids respond (e.g. some secoiridoids and valepotriates) – a negative result does not exclude iridoids.", "Use freshly prepared reagent.", "Strongly coloured material may mask the result – use a small amount of material.", "Acid reagent – fume hood, gloves."]},
{"id": "t_iriacid", "c": "irid", "n": "Acid darkening test", "aim": "Iridoids such as aucubin (supportive).", "need": ["dhcl"], "ex": ["Test tube", "Water bath"], "smp": "Aqueous extract or crushed plant material.", "pr": ["Warm 2 mL extract (or a little material in water) with 1 mL dilute HCl on a water bath for a few minutes.", "Observe the colour."], "pos": "Blue-green to dark brown/black colour or precipitate → aucubin-type iridoids (aglycone polymerizes).", "neg": "No darkening.", "ctl": "Plantago leaf.", "pc": ["Supportive only – other compounds can darken in hot acid.", "Confirm with Trim & Hill test or TLC."]},
{"id": "t_ninh", "c": "prot", "n": "Ninhydrin test", "aim": "Free amino acids and proteins.", "need": ["ninhydrin"], "ex": ["Boiling water bath"], "smp": "2 mL aqueous extract (neutral).", "pr": ["Add 0.5 mL ninhydrin reagent to 2 mL sample.", "Heat in a boiling water bath for 1–2 min."], "pos": "Blue-purple (Ruhemann's purple). Proline → yellow.", "neg": "No colour.", "ctl": "Glycine 0.1%.", "pc": ["Ammonia/ammonium salts also give purple – avoid ammonia-containing samples.", "Ninhydrin stains skin for days – gloves."]},
{"id": "t_biur", "c": "prot", "n": "Biuret test", "aim": "Proteins and peptides.", "need": ["biuret"], "ex": ["Test tubes"], "smp": "2 mL sample.", "pr": ["Add 2 mL 10% NaOH to 2 mL sample; mix.", "Add 1–2 drops 1% CuSO₄; mix."], "pos": "Violet / purple colour.", "neg": "Blue (colour of copper reagent).", "ctl": "Egg albumin solution.", "pc": ["Add CuSO₄ drop by drop – excess gives a blue colour that masks the result.", "NaOH is caustic."], "pi": ["t_biur-positive.jpg", "t_biur-positive-2.jpg"]},
{"id": "t_xan", "c": "prot", "n": "Xanthoproteic test", "aim": "Proteins with aromatic amino acids.", "need": ["xantho"], "ex": ["Water bath"], "smp": "2 mL sample.", "pr": ["Add 1 mL conc. HNO₃ to 2 mL sample (white ppt may form).", "Heat gently; cool.", "Add 10% ammonia until alkaline."], "pos": "Yellow on heating → orange with ammonia.", "neg": "No yellow colour.", "ctl": "Egg albumin.", "pc": ["Conc. HNO₃ – fume hood; stains skin yellow.", "Heat gently, tube pointed away."]},
{"id": "p_acid", "c": "other", "n": "Acid extract for alkaloid tests", "aim": "Converts alkaloids into water-soluble salts for precipitation tests.", "need": ["dhcl", "nh3"], "ex": ["Chloroform", "Separating funnel", "Filter paper", "Water bath"], "smp": "0.5–1 g powdered drug.", "pr": ["QUICK METHOD: warm 0.5–1 g powder with 10 mL dilute HCl (or 1% H₂SO₄) on a water bath for 5–10 min.", "Cool and filter. Use the clear filtrate for the precipitation tests.", "PURIFIED METHOD (recommended – fewer false positives): moisten 1 g powder with 10% ammonia, then shake/extract with 10 mL chloroform for 10 min.", "Filter the chloroform; shake it with 5 mL dilute HCl in a separating funnel.", "Collect the upper acid layer – it contains the alkaloids as salts. Use it for the tests."], "pos": "—", "neg": "—", "ctl": "Keep 1 mL of the acid extract without reagent as a blank for comparison.", "pc": ["Proteins, tannins and some glycosides in a crude extract can precipitate with alkaloid reagents → prefer the purified method.", "Filtrate must be clear; turbidity before adding reagent makes results unreadable.", "Chloroform and ammonia: fume hood."]},
{"id": "p_aq", "c": "other", "n": "Aqueous extract", "aim": "For sugars, tannins, saponins, mucilage and water-soluble glycosides.", "need": [], "ex": ["Beaker", "Water bath / hot plate", "Filter paper"], "smp": "2 g powdered drug.", "pr": ["Add 20 mL distilled water to 2 g powder.", "Boil gently for 5 min (or warm on a water bath 15 min).", "Cool and filter. Make up to 20 mL with water if needed."], "pos": "—", "neg": "—", "ctl": "", "pc": ["Use within the same day – aqueous extracts ferment and grow microbes.", "For saponins do not shake while boiling (foam overflows)."]},
{"id": "p_eth", "c": "other", "n": "Ethanolic extract & dry residue", "aim": "For flavonoids, phenolics, cardiac glycosides, steroids/terpenoids and anthraquinones.", "need": ["eth70"], "ex": ["Ethanol 70–96%", "Water bath", "Porcelain dish", "Filter paper"], "smp": "2 g powdered drug.", "pr": ["Add 20 mL ethanol (70% or 96%) to 2 g powder.", "Warm on a water bath for 10 min (preferably under a reflux condenser), shaking occasionally.", "Cool and filter.", "Use part of the filtrate directly (flavonoid, phenolic tests).", "Evaporate portions to dryness in porcelain dishes on a water bath to obtain residues for Keller–Killiani, Liebermann–Burchard and Salkowski tests."], "pos": "—", "neg": "—", "ctl": "", "pc": ["Ethanol is flammable – water bath only, NO open flame.", "Residues for Liebermann–Burchard must be completely dry (water spoils the test).", "For steroid/terpene tests, extracting with petroleum ether or chloroform gives a cleaner residue (less chlorophyll)."]},
{"id": "t_lignin", "c": "other", "n": "Test for lignin", "aim": "Locate lignified elements: vessels, fibres, sclereids, stone cells.", "need": ["phloro"], "ex": ["Slide & cover slip", "Filter paper strips"], "smp": "Transverse section or a small amount of powder.", "pr": ["Place the section/powder on a clean slide.", "Add 1–2 drops phloroglucinol solution.", "Leave 1–2 min until almost dry.", "Add 1 drop concentrated HCl.", "Cover with a cover slip; blot excess acid; examine at once."], "pos": "Lignified walls stain pink to cherry-red.", "neg": "Walls stay colourless (cellulose, unlignified parenchyma).", "ctl": "A known lignified drug (e.g. quassia wood) as positive.", "pc": ["Conc. HCl corrodes microscope lenses and stage – never let acid touch the objective; wipe the underside of the slide.", "Examine within a few minutes; colour fades.", "Do not heat the preparation."]},
{"id": "t_starch", "c": "other", "n": "Test for starch", "aim": "Detect starch grains and study their shape.", "need": ["iodine"], "ex": ["Slide & cover slip"], "smp": "Powder or section mounted in water (NOT chloral hydrate).", "pr": ["Mount the powder in water and examine starch grain shape (hilum, striations) first.", "Irrigate with 1 drop iodine solution at the edge of the cover slip.", "Examine again."], "pos": "Starch grains turn blue to blue-black.", "neg": "No blue grains.", "ctl": "Potato or wheat starch as positive.", "pc": ["Chloral hydrate and boiling destroy starch – do not clear before this test.", "Too much iodine makes everything dark – dilute the reagent.", "Gelatinized (heated) starch stains diffusely without grain shape."]},
{"id": "t_cell", "c": "other", "n": "Test for cellulose", "aim": "Distinguish cellulose walls from lignified/suberized walls.", "need": ["czi"], "ex": ["Slide & cover slip"], "smp": "Section or powder.", "pr": ["Add 1–2 drops chlor-zinc-iodine to the specimen.", "Leave 1–2 min.", "Cover and examine."], "pos": "Cellulose walls → blue-violet.", "neg": "Lignified, suberized or cutinized walls → yellow-brown.", "ctl": "Cotton fibre as positive.", "pc": ["Reagent deteriorates – use freshly prepared (weeks).", "Starch also turns blue-black; don't confuse grains with walls."]},
{"id": "t_fat", "c": "other", "n": "Test for fixed oil, fat, cutin & suberin", "aim": "Detect oil globules, oil cells, cuticle and cork.", "need": ["sudan"], "ex": ["Slide & cover slip", "Spirit lamp (gentle warming)"], "smp": "Section or powder.", "pr": ["Mount specimen in 2–3 drops Sudan III.", "Warm very gently or leave 5–10 min.", "Cover and examine."], "pos": "Oil globules, cuticle, suberized walls → orange-red.", "neg": "No red-stained structures.", "ctl": "Linseed or castor seed section as positive.", "pc": ["Do not boil – ethanol in the reagent is flammable and evaporates.", "Dye precipitates can look like red particles – filter the reagent."]},
{"id": "t_muc", "c": "other", "n": "Test for mucilage", "aim": "Detect mucilage cells and pectic substances.", "need": ["ruth"], "ex": ["Slide & cover slip", "Absolute ethanol (optional)"], "smp": "Dry powder or section.", "pr": ["Mount the dry powder directly in ruthenium red solution.", "Leave 2–3 min, cover and examine.", "Optional: mount first in absolute ethanol to see unswollen mucilage cells, then irrigate with reagent."], "pos": "Mucilage → pink to red (swelling may be seen).", "neg": "No pink-red staining.", "ctl": "Ispaghula or linseed as positive.", "pc": ["Water makes mucilage swell and spread – observe quickly.", "Pectin-rich walls also stain pink (expected)."]},
{"id": "t_ox", "c": "other", "n": "Test for calcium oxalate & calcium carbonate", "aim": "Identify crystals and cystoliths.", "need": ["chloral", "oxalate", "dhcl"], "ex": ["Slide & cover slip", "Filter paper strips", "Polarizing microscope (optional)"], "smp": "Powder cleared with chloral hydrate.", "pr": ["Clear the powder in chloral hydrate and note crystal type: prisms, rosettes (cluster crystals), raphides (needles) or microsphenoidal sand.", "Irrigate with 6% acetic acid → observe.", "On a fresh mount, irrigate with dilute HCl → observe.", "On a fresh mount, irrigate with 66% H₂SO₄ → observe for several minutes."], "pos": "Calcium oxalate: insoluble in acetic acid; dissolves in HCl WITHOUT effervescence; dissolves in 66% H₂SO₄ with formation of needle-shaped calcium sulfate crystals. Calcium carbonate: dissolves in acids WITH effervescence.", "neg": "Crystals unaffected by all acids → other crystal types (e.g. silica).", "ctl": "Rhubarb (clusters) or squill (raphides) as positive.", "pc": ["Air bubbles may be mistaken for effervescence – watch the crystal itself.", "Polarized light: oxalate crystals are bright (birefringent).", "66% H₂SO₄: prepare by adding acid to water with cooling; never touch the objective."]},
{"id": "t_tanc", "c": "other", "n": "Test for tannin cells", "aim": "Locate tannin-containing cells in sections.", "need": ["fecl3"], "ex": ["Slide & cover slip"], "smp": "Fresh or dry section.", "pr": ["Add 1–2 drops ferric chloride 5% to the section.", "Cover and examine."], "pos": "Cell contents → blue-black (hydrolysable) or green-black (condensed tannins).", "neg": "No dark cell contents.", "ctl": "Oak gall or hamamelis as positive.", "pc": ["Iron from tools/needles can cause dark spots – use glass rods.", "Other phenolics also react; confirm with gelatin test in extract."]},
{"id": "t_aleu", "c": "other", "n": "Test for aleurone grains (proteins)", "aim": "Detect protein (aleurone) grains in seeds.", "need": ["iodine"], "ex": ["Slide & cover slip"], "smp": "Section of seed endosperm/cotyledon (e.g. linseed, almond), mounted in oil or glycerol.", "pr": ["Mount section, add 1 drop iodine solution.", "Cover and examine."], "pos": "Aleurone grains → yellow-brown (globoids and crystalloids visible).", "neg": "No yellow-brown grains.", "ctl": "", "pc": ["Mount in water dissolves some aleurone grains – use glycerol or oil mounting for structure.", "Starch present will turn blue-black – distinguish by colour."]},
{"id": "t_cyan", "c": "other", "n": "Test for cyanogenic glycosides", "aim": "HCN released by enzymatic hydrolysis.", "need": ["picrate"], "ex": ["Test tube with cork", "Incubator/water bath 37 °C"], "smp": "1–2 g freshly crushed drug.", "pr": ["Place the crushed drug in a test tube and moisten with a few drops of water (± 1 drop chloroform to aid enzyme action).", "Moisten a picrate paper strip with 10% Na₂CO₃.", "Suspend the strip from the cork above the drug – it must not touch it.", "Stopper tightly; keep at ~37 °C for 15–60 min."], "pos": "Paper turns orange → brick-red.", "neg": "Paper stays yellow.", "ctl": "Bitter almond or linseed (positive).", "pc": ["HCN is extremely toxic – open the tube only in a fume hood.", "Heat-dried or old drugs may have inactive enzyme → add emulsin/enzyme source or acid hydrolysis.", "Dry picric acid is explosive."]},
{"id": "t_voil", "c": "other", "n": "Tests for volatile oils", "aim": "Detect volatile oils in drugs and extracts.", "need": ["sudan", "voil"], "ex": ["Filter paper", "Slides"], "smp": "Section, powder or petroleum ether extract.", "pr": ["Microscopy: mount section in Sudan III; oil glands/ducts/secretory cells stain red.", "Paper test: put a drop of extract on filter paper and let stand.", "Odour: crush the drug and note aromatic odour."], "pos": "Red-stained oil droplets; spot on paper disappears (evaporates) → volatile oil.", "neg": "A translucent permanent spot → fixed oil (not volatile).", "ctl": "Clove or fennel.", "pc": ["Sudan III stains both fixed and volatile oils – combine with the paper test.", "Confirm by TLC with anisaldehyde–H₂SO₄."]},
{"id": "t_tlc", "c": "other", "n": "General TLC procedure & detection", "aim": "Separate and detect constituents; compare with reference standards.", "need": ["anis", "drag", "nppeg", "kohtlc", "h2so4tlc", "iodvap"], "ex": ["Silica gel plate (F254)", "Capillary tubes", "TLC tank with lid", "Filter paper (saturation)", "Pencil & ruler", "Sprayer", "Hot plate / oven", "UV lamp 254 & 366 nm"], "smp": "Concentrated extract (methanol/ethanol) and reference standard solutions (~1 mg/mL).", "pr": ["Pour the mobile phase into the tank (depth ~0.5 cm), line with filter paper, close, and saturate 15–30 min.", "With a soft pencil, draw the start line 1–1.5 cm from the bottom of the plate.", "Apply sample and standard as small spots or bands (2–5 mm), at least 1 cm apart; dry between applications.", "Place the plate in the tank – the start line must be ABOVE the solvent level. Close the lid.", "Develop until the solvent front is ~1 cm from the top; remove and immediately mark the front with pencil.", "Dry the plate completely (fume hood / hair dryer).", "View under UV 254 nm (dark spots) and 366 nm (fluorescent spots); circle spots with pencil.", "Spray evenly with the detection reagent (fine mist – do not wet), heat if required, observe.", "Calculate Rf = distance travelled by spot ÷ distance travelled by solvent front."], "pos": "Spot in the sample with the same Rf and colour as the standard → compound probably present.", "neg": "No spot matching the standard.", "ctl": "Always co-chromatograph a reference standard on the same plate.", "pc": ["Spots too large or overloaded → tailing and poor separation; keep spots small.", "Never spot below the solvent level – sample dissolves into the solvent.", "Remove all solvent (especially acids/ammonia) before spraying.", "Spray in a fume hood; most sprays contain conc. H₂SO₄ or methanol.", "Rf varies with saturation, temperature and plate – compare only with standards on the same plate.", "UV light damages eyes – use protective glasses."]}
];

 $("#back").style.display=back?"block":"none";$("#info").style.display=top?"flex":"none";$("#logo").style.display=top?"block":"none";
 const st=$("#star");if(key){st.style.display="block";st.innerHTML=ico("star",store.fav.includes(key)?"fill":"");st.onclick=()=>{const i=store.fav.indexOf(key);i<0?store.fav.push(key):store.fav.splice(i,1);save();st.innerHTML=ico("star",i<0?"fill":"");toast(i<0?"Saved":"Removed")}}else st.style.display="none"}
function navOn(k){if(["tools","saved","about","more"].includes(k))k="more";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===k))}
function itemR(r){return `<div class="item" data-go="r-${r.id}"><b>${esc(r.n)}</b><span>${esc(r.u)}</span></div>`}
function itemT(t){return `<div class="item test" data-go="t-${t.id}"><b>${esc(t.n)}</b><span>${esc(t.aim)}</span></div>`}
function wrap(h){return h?`<div class="list">${h}</div>`:`<div class="empty">Nothing found.</div>`}
function bind(){app.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>go(e.dataset.go))}

function card(go,icn,count,name,desc){return `<div class="tile" data-go="${go}"><div class="trow"><span class="ic">${icn}</span><span class="cnt">${count}</span></div><b>${esc(name)}</b>${desc?`<small>${esc(desc)}</small>`:""}</div>`}
const plural=(n,w)=>n+" "+(n===1?w:(w==="entry"?"entries":w+"s"));
function searchBar(ph){return `<div class="sbar" id="q" role="button" tabindex="0">${ico("search")}<span>${esc(ph)}</span></div>`}

 <h2 class="ptitle">Reagents</h2><p class="psub">Choose a group to see how to prepare each reagent.</p>
 <div class="grid">${SECTIONS.map(s=>card("s-"+s.id,sico(s.ic),plural(R.filter(r=>r.s===s.id).length,"reagent"),s.n,s.d)).join("")}</div>`;

  $("#res").innerHTML=(ts.length?`<div class="lbl">Tests (${ts.length})</div>${wrap(ts.map(itemT).join(""))}`:"")+(rs.length?`<div class="lbl">Reagents (${rs.length})</div>${wrap(rs.map(itemR).join(""))}`:"")+(as.length?`<div class="lbl">Atlas (${as.length})</div>${wrap(as.map(itemA).join(""))}`:"")+(!ts.length&&!rs.length&&!as.length?`<div class="empty">Nothing found.</div>`:"");bind()};

function linkChip(id){if(String(id).startsWith("calc-")){const c=CALCS.find(x=>x.id===id.slice(5));return c?`<button class="chip lnk" data-go="${id}">${ico("calc")} ${esc(c.n)}</button>`:""}const at=aById(id);if(at)return `<button class="chip lnk" data-go="a-${id}">${ico(((asec(at.s)||{}).g||"micro")==="micro"?"microscope":"plantleafl")} ${esc(at.n)}</button>`;const r=byId(id),t=tById(id);if(r)return `<button class="chip lnk" data-go="r-${id}">${ico("flask")} ${esc(r.n)}</button>`;if(t)return `<button class="chip lnk" data-go="t-${id}">${ico("clipboard")} ${esc(t.n)}</button>`;return ""}

function reagent(id){const r=byId(id);if(!r)return home();setHeader(sec(r.s).n.replace("Microscopy – ",""),true,id);navOn("reagents");factor=1;
 const scalable=r.p.some(p=>p.i.some(i=>i[1]!=null));
 const used=T.filter(t=>t.need.includes(id));
 app.innerHTML=`<h2 class="title">${esc(r.n)}</h2><p class="aka">${esc(r.a)}</p>
 <div class="tags">${r.h.length?r.h.map(h=>`<span class="tag">${ico("warn")} ${esc(h)}</span>`).join(""):`<span class="tag ok">Low hazard</span>`}</div>
 <div class="card"><h3>Used for</h3>${esc(r.u)}</div>
 <div class="card"><h3>Ingredients</h3>
  ${scalable?`<div class="chips" id="sc">${[0.25,0.5,1,2,5].map(f=>`<button class="chip${f===1?" on":""}" data-f="${f}">×${f}</button>`).join("")}${r.y?`<input type="number" inputmode="decimal" id="vol" placeholder="mL">`:""}</div>`:""}
  <div id="ing" style="margin-top:10px"></div></div>
 <div class="card"><h3>Preparation (tap to tick)</h3><ol class="steps">${r.m.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>
 ${used.length?`<div class="card"><h3>Full test procedures</h3><div class="chips">${used.map(t=>linkChip(t.id)).join("")}</div></div>`:""}
 ${r.t&&r.t!=="—"?`<div class="card"><h3>Quick use</h3>${esc(r.t).replace(/\n/g,"<br><br>")}${r.r&&r.r!=="—"?`<div class="res"><b>Positive:</b> ${esc(r.r)}</div>`:""}</div>`:""}
 <div class="card"><h3>Storage</h3>${esc(r.st)}</div>
 ${r.sf&&r.sf!=="—"?`<div class="card safety"><h3>${ico("warn")} Safety</h3>${esc(r.sf)}</div>`:""}
 ${r.nt?`<div class="card note"><h3>${ico("bulb")} Notes & tips</h3>${esc(r.nt)}</div>`:""}
 <div class="btnrow"><button class="btn pri" id="copy">Copy recipe</button></div>`;
 drawIng(r);bind();tickable();
 const sc=$("#sc");if(sc){sc.querySelectorAll("[data-f]").forEach(c=>c.onclick=()=>{factor=+c.dataset.f;sc.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x===c));const v=$("#vol");if(v)v.value="";drawIng(r)});
  const v=$("#vol");if(v)v.oninput=()=>{const x=parseFloat(v.value);if(x>0){factor=x/r.y;sc.querySelectorAll("[data-f]").forEach(c=>c.classList.remove("on"));drawIng(r)}}}
 $("#copy").onclick=()=>copyText(recipeText(r))}

function test(id){const t=tById(id);if(!t)return testsHome();setHeader(tsec(t.c).n,true,"t:"+id);navOn("");
 const has=x=>x&&x!=="—";
 app.innerHTML=`<h2 class="title">${esc(t.n)}</h2><p class="aka">${esc(t.aim)}</p>
 ${t.need.length||t.ex.length?`<div class="card"><h3>Prepare first</h3>${t.need.length?`<div class="chips">${t.need.map(linkChip).join("")}</div>`:""}${t.ex.length?`<div class="mats"><b>Also needed:</b> ${t.ex.map(esc).join(" · ")}</div>`:""}</div>`:""}
 <div class="card"><h3>Sample</h3>${esc(t.smp)}</div>
 <div class="card"><h3>Procedure (tap to tick)</h3><ol class="steps">${t.pr.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>
 ${has(t.pos)||has(t.neg)?`<div class="card"><h3>Results</h3>
  ${has(t.pos)?`<div class="res pos"><b>${ico("check")} Positive:</b> ${esc(t.pos)}${resImgs(t.pi,"Positive – "+t.n)}</div>`:""}
  ${has(t.neg)?`<div class="res neg"><b>${ico("x")} Negative:</b> ${esc(t.neg)}${resImgs(t.ni,"Negative – "+t.n)}</div>`:""}</div>`:""}
 ${t.ctl?`<div class="card"><h3>Controls</h3>${esc(t.ctl)}</div>`:""}
 ${t.pc.length?`<div class="card note"><h3>${ico("warn")} Precautions & sources of error</h3><ul class="pc">${t.pc.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:""}
 <div class="btnrow"><button class="btn pri" id="copy">Copy procedure</button></div>`;
 bind();tickable();zoomable();$("#copy").onclick=()=>copyText(testText(t))}

const APP_BUILD="v41";
const IMG_EXT=[".jpg",".jpeg",".JPG",".JPEG",".png",".PNG",".webp"];
function tryLoad(src,ok,fail){const m=src.match(/^(.*?)(\.[A-Za-z]+)?$/),base=m[1],c=[src,...IMG_EXT.filter(x=>x!==(m[2]||"")).map(x=>base+x)];let k=0;
 const next=()=>{if(k>=c.length)return fail();const u=c[k++],im=new Image();im.onload=()=>ok(u,im.naturalWidth/im.naturalHeight||1.33);im.onerror=next;im.src=u};next()}
function hydrate(root){(root||document).querySelectorAll("[data-src]:not([data-h])").forEach(el=>{el.dataset.h="1";
 tryLoad(el.dataset.src,(u,r)=>{el.style.backgroundImage=`url("${u}")`;el.dataset.url=u;if(el.classList.contains("pimg")){const h=el.offsetHeight||150;el.style.width=Math.round(h*r)+"px"}el.classList.add("ok")},
  ()=>{el.remove();if(typeof chkPh==="function")chkPh()})})}
function imgSrc(f){return /^(https?:|data:|\.?\/)/.test(f)||f.includes("/")?f:"images/"+f}
function resImgs(list,cap){return list&&list.length?`<div class="rimgs">${list.map(f=>`<span class="pimg" role="img" aria-label="${esc(cap)}" data-cap="${esc(cap)}" data-src="${esc(encodeURI(imgSrc(f)))}"></span>`).join("")}</div>`:""}
function zoomable(){app.querySelectorAll(".rimgs .pimg").forEach(w=>w.onclick=()=>{if(!w.dataset.url)return;modal(`<div class="zoombg" style="background-image:url('${w.dataset.url}')"></div><p class="aka" style="margin:10px 0 12px;text-align:center">${esc(w.dataset.cap||"")}</p><button class="btn wide" id="zc">Close</button>`,(m,close)=>{m.querySelector("#zc").onclick=close;m.querySelector(".zoombg").onclick=close})})}
function tickable(){app.querySelectorAll("ol.steps li").forEach(li=>li.onclick=()=>li.classList.toggle("done"))}
function qtyStr(i){if(i[1]==null)return esc(i[2]||"");const q=fmt(i[1]*factor);return i[3]==="to"?`to ${q} ${i[2]}`:`${q} ${i[2]}`}
function drawIng(r){$("#ing").innerHTML=r.p.map(p=>`${p.t?`<div class="part">${esc(p.t)}</div>`:""}<table>${p.i.map(i=>`<tr><td>${esc(i[0])}</td><td class="q">${qtyStr(i)}</td></tr>`).join("")}</table>`).join("")+(r.y?`<div class="yield">Makes about <b>${fmt(r.y*factor)} mL</b>${factor!==1?` (×${fmt(factor)})`:""}. Type a volume in the mL box to scale exactly.</div>`:"")}
const un=s=>s.replace(/&amp;/g,"&");
function recipeText(r){return `${r.n} (${r.a})\nUse: ${r.u}\n\nIngredients${factor!==1?` (×${fmt(factor)})`:""}:\n`+r.p.map(p=>(p.t?p.t+":\n":"")+p.i.map(i=>`• ${i[0]}: ${un(qtyStr(i))}`).join("\n")).join("\n")+`\n\nPreparation:\n`+r.m.map((s,k)=>`${k+1}. ${s}`).join("\n")+(r.t&&r.t!=="—"?`\n\nTest: ${r.t}`:"")+(r.r&&r.r!=="—"?`\nPositive: ${r.r}`:"")+`\nStorage: ${r.st}\nSafety: ${r.sf}`}
function testText(t){const nm=id=>(byId(id)||tById(id)||{}).n;return `${t.n}\nAim: ${t.aim}\n`+(t.need.length?`Prepare: ${t.need.map(nm).filter(Boolean).join(", ")}\n`:"")+(t.ex.length?`Also needed: ${t.ex.join(", ")}\n`:"")+`Sample: ${t.smp}\n\nProcedure:\n`+t.pr.map((s,k)=>`${k+1}. ${s}`).join("\n")+(t.pos!=="—"?`\n\nPositive: ${t.pos}`:"")+(t.neg!=="—"?`\nNegative: ${t.neg}`:"")+(t.ctl?`\nControls: ${t.ctl}`:"")+(t.pc.length?`\n\nPrecautions:\n`+t.pc.map(p=>`• ${p}`).join("\n"):"")}
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>fallbackCopy(t))}catch(e){fallbackCopy(t)}}
function fallbackCopy(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copied")}catch(e){toast("Copy not allowed")}a.remove()}

const PRESETS=[];
function buildPresets(std){PRESETS.splice(0,PRESETS.length);if(std.length)PRESETS.push({id:"std",n:"Standard phytochemical screening",t:std});
 TSECS.forEach(s=>{const ts=T.filter(t=>t.c===s.id&&CL[t.id]).map(t=>t.id);if(ts.length)PRESETS.push({id:s.id,n:s.n,t:ts})});PRESETS.push({id:"custom",n:"Custom – pick tests",t:[]})}
buildPresets(["t_molisch", "t_fehling", "t_iod", "t_alk", "t_keller", "t_kedde", "t_bornm", "t_cyan", "t_froth", "t_fecl3", "t_gel", "t_shin", "t_alcl", "t_lb", "t_salk", "t_voil", "t_biur", "t_trim"]);
const VALS=["","+","++","+++","±","–"], RANK={"+++":5,"++":4,"+":3,"±":2,"–":1,"":0};
store.sheets=store.sheets||[];
const uid=()=>Math.random().toString(36).slice(2,8);
const shById=id=>store.sheets.find(s=>s.id===id);
const today=()=>new Date().toISOString().slice(0,10);

function modal(html,onReady){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="sheetbox">${html}</div>`;document.body.appendChild(m);
 m.onclick=e=>{if(e.target===m)m.remove()};onReady&&onReady(m,()=>m.remove());return m}
function confirmBox(msg,ok){modal(`<p style="margin:0 0 14px">${esc(msg)}</p><div class="btnrow"><button class="btn" id="mc">Cancel</button><button class="btn danger" id="mo">Delete</button></div>`,(m,close)=>{m.querySelector("#mc").onclick=close;m.querySelector("#mo").onclick=()=>{close();ok()}})}

 const l=[...store.sheets].sort((a,b)=>b.date.localeCompare(a.date));
 app.innerHTML=`<h2 class="ptitle">Results sheets</h2><p class="psub">Record +/– results for your samples and export them.</p><button class="btn pri wide" id="new">${ico("plus")} New results sheet</button>
 ${l.length?`<div class="list">${l.map(s=>{const done=Object.values(s.v).filter(Boolean).length,tot=s.tests.length*s.samples.length;
  return `<div class="item" data-go="sheet-${s.id}"><b>${esc(s.title)}</b><span>${s.date} · ${s.samples.map(x=>esc(x.n)).join(", ")} · ${done}/${tot} recorded</span></div>`}).join("")}</div>`
 :`<div class="empty">No sheets yet.<br>Create one to record +/– results for one or more drug samples, then copy the table into Word, Excel or WhatsApp.</div>`}

function testPicker(sel){return TSECS.filter(s=>T.some(t=>t.c===s.id&&CL[t.id])).map(s=>`<div class="part">${sico(s.ic)} ${esc(s.n)}</div>${T.filter(t=>t.c===s.id&&CL[t.id]).map(t=>`<label class="ck"><input type="checkbox" value="${t.id}"${sel.includes(t.id)?" checked":""}> ${esc(t.n)}</label>`).join("")}`).join("")}

function newSheet(){
 modal(`<h3 class="mh">New results sheet</h3>
 <label class="f">Title</label><input class="inp" id="nt" placeholder="e.g. Phytochemical screening – Group A">
 <label class="f">Samples (drugs), separated by commas</label><input class="inp" id="ns" placeholder="e.g. Senna leaf, Rhubarb, Cinchona bark">
 <label class="f">Test panel</label><div class="chips" id="np">${PRESETS.map((p,i)=>`<button class="chip${i===0?" on":""}" data-p="${p.id}">${esc(p.n)}</button>`).join("")}</div>
 <div id="pick" class="pick" style="display:none"></div>
 <div class="btnrow" style="margin-top:14px"><button class="btn" id="nc">Cancel</button><button class="btn pri" id="nok">Create</button></div>`,
 (m,close)=>{let preset=PRESETS[0].id;const q=s=>m.querySelector(s);
  m.querySelectorAll("[data-p]").forEach(c=>c.onclick=()=>{preset=c.dataset.p;m.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("on",x===c));
   const pk=q("#pick");if(preset==="custom"){pk.style.display="block";pk.innerHTML=testPicker([])}else pk.style.display="none"});
  q("#nc").onclick=close;
  q("#nok").onclick=()=>{const names=q("#ns").value.split(",").map(x=>x.trim()).filter(Boolean);
   const tests=preset==="custom"?[...m.querySelectorAll("#pick input:checked")].map(x=>x.value):PRESETS.find(p=>p.id===preset).t;

function summary(s,x){const best={};s.tests.forEach(t=>{const lab=CL[t]||tById(t).n,v=s.v[t+"|"+x.id]||"";if(!(lab in best)||RANK[v]>RANK[best[lab]])best[lab]=v});
 const pos=[],dbt=[],neg=[];Object.entries(best).forEach(([l,v])=>{if(RANK[v]>=3)pos.push(`${l} (${v})`);else if(v==="±")dbt.push(l);else if(v==="–")neg.push(l)});return {pos,dbt,neg}}
async function exportXlsx(s){
 try{if(!window.XLSX)await loadScript("xlsx.mini.min.js")}catch(e){try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.mini.min.js")}catch(e2){toast("Excel export not available here");return}}
 const n=s.samples.length,rows=[[s.title],["Date: "+s.date],[],["Test","Detects",...s.samples.map(x=>x.n)]];
 TSECS.forEach(g=>{const ts=s.tests.filter(t=>tById(t)&&tById(t).c===g.id);if(!ts.length)return;rows.push([g.n]);
  ts.forEach(t=>rows.push([tById(t).n,CL[t]||"",...s.samples.map(x=>(s.v[t+"|"+x.id]||"").replace("–","-"))]))});
 const sumStart=rows.length+1;rows.push([],["SUMMARY"],["Sample","Present","Doubtful","Absent"]);
 s.samples.forEach(x=>{const r=summary(s,x);rows.push([x.n,r.pos.join(", ").replace(/–/g,"-")||"-",r.dbt.join(", ")||"-",r.neg.join(", ")||"-"])});
 if(s.notes)rows.push([],["Notes",s.notes]);
 rows.push([],["Key: + weak, ++ moderate, +++ strong, ± doubtful, - absent"],["Exported from Elixir Lab"]);
 const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:42},{wch:26},...s.samples.map(()=>({wch:14}))];
 ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:Math.max(1,n+1)}}];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Results");
 const out=XLSX.write(wb,{bookType:"xlsx",type:"array"}),mime="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
 const name=(s.title.replace(/[^\w\- ]+/g," ").replace(/\s+/g," ").trim().slice(0,60)||"Results")+" "+s.date+".xlsx";
 const blob=new Blob([out],{type:mime});let file=null;try{file=new File([blob],name,{type:mime})}catch(e){}
 const canShare=file&&navigator.canShare&&navigator.canShare({files:[file]});
 const download=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast("Saved to Downloads")}catch(e){toast("Download blocked here – use the installed app")}};
 modal(`<h3 class="mh">Excel file ready</h3><p class="aka" style="margin:0 0 14px">${esc(name)}</p>
  <div class="btnrow">${canShare?`<button class="btn pri" id="xsh">Share…</button>`:""}<button class="btn${canShare?"":" pri"}" id="xdl">Download</button></div>
  <p class="disc" style="margin-top:4px">${canShare?"Share sends it straight to WhatsApp, Gmail, Drive… ":""}Download saves it to your phone's Downloads folder.</p>`,
  (m,close)=>{m.querySelector("#xdl").onclick=()=>{download();close()};
   const sh=m.querySelector("#xsh");if(sh)sh.onclick=async()=>{try{await navigator.share({files:[file],title:s.title})}catch(e){}close()}})}
function sheetTSV(s){return ["Test\tDetects\t"+s.samples.map(x=>x.n).join("\t"),...s.tests.map(t=>`${tById(t).n}\t${CL[t]||""}\t`+s.samples.map(x=>(s.v[t+"|"+x.id]||"").replace("–","-")).join("\t"))].join("\n")}
function sheetReport(s){return `${s.title}\nDate: ${s.date}\n\n`+s.samples.map(x=>{const r=summary(s,x);return `▸ ${x.n}\n`+s.tests.map(t=>`  • ${tById(t).n}: ${s.v[t+"|"+x.id]||"not recorded"}`).join("\n")+`\n  Present: ${r.pos.join(", ")||"—"}\n  Absent: ${r.neg.join(", ")||"—"}`+(r.dbt.length?`\n  Doubtful: ${r.dbt.join(", ")}`:"")}).join("\n\n")+(s.notes?`\n\nNotes: ${s.notes}`:"")+`\n\nKey: + weak, ++ moderate, +++ strong, ± doubtful, – absent`}

const f2=x=>(Math.round(x*100)/100).toFixed(2), f4=x=>(+x.toPrecision(4)).toString();
const CALCS=[
 {id:"moisture",g:"Quality control",n:"Moisture content (loss on drying)",d:"Water and volatile matter lost on drying at 105 °C.",

   const p=a/s*100;return {r:`Total ash = <b>${f2(p)} %</b>`,s:[`Weight of drug = ${f4(v.w2)} − ${f4(v.w1)} = ${f4(s)} g`,`Weight of ash = ${f4(v.w3)} − ${f4(v.w1)} = ${f4(a)} g`,`% = ${f4(a)} ÷ ${f4(s)} × 100 = ${f2(p)} %`]}},

  opt:["v2","v3"],
  c:v=>{if(v.w<=0)return "Enter the drug weight.";const vs=[v.v1,v.v2,v.v3].filter(x=>x>0);if(!vs.length)return "Enter at least one swollen volume.";
   const m=vs.reduce((a,b)=>a+b,0)/vs.length,si=m/v.w;return {r:`Swelling index = <b>${f2(si)} mL/g</b>`,s:[vs.length>1?`Mean volume = (${vs.map(f4).join(" + ")}) ÷ ${vs.length} = ${f2(m)} mL`:`Volume = ${f4(m)} mL`,`Swelling index = ${f2(m)} ÷ ${f4(v.w)} = ${f2(si)} mL/g`]}},
  fm:"Swelling index = mean volume (mL) occupied by the swollen drug ÷ weight of drug (g)",nt:"Place 1 g drug in a 25 mL glass-stoppered graduated cylinder, moisten with 1 mL ethanol 96%, add 25 mL water, shake every 10 min for 1 h, then let stand (4 h, or as stated in the monograph). Read the volume of the swollen material. Run three tests at the same time and take the mean."},
 {id:"foaming",g:"Quality control",n:"Foaming index",d:"Foaming ability of saponin-containing drugs (WHO method).",
  f:[["a","Volume of decoction (mL) in the tube with 1 cm of foam"],["df","Dilution factor of decoction (1 if not diluted)",1]],
  c:v=>{if(v.a<=0)return "Enter the volume a.";if(v.a>10)return "a must be between 1 and 10 mL. If no tube reaches 1 cm, the foaming index is less than 100.";const df=v.df>0?v.df:1,fi=1000*df/v.a;
   return {r:`Foaming index = <b>${Math.round(fi)}</b>`,s:[df!==1?`Foaming index = 1000 × ${f4(df)} ÷ ${f4(v.a)} = ${Math.round(fi)}`:`Foaming index = 1000 ÷ ${f4(v.a)} = ${Math.round(fi)}`]}},
  fm:"Foaming index = 1000 ÷ a   (a = mL of decoction in the tube with 1 cm foam)",nt:"Boil 1 g powder in 100 mL water for 30 min, cool, filter, and make up to 100 mL. Put 1, 2, 3 … 10 mL into ten test tubes and make each up to 10 mL with water. Stopper, shake lengthwise for 15 s, stand 15 min and measure the foam height. If foam is less than 1 cm in all tubes → index < 100. If more than 1 cm in tube 1 already → dilute the decoction further (enter the dilution factor)."},
 {id:"stomatal",g:"Quality control",n:"Stomatal index",d:"Proportion of stomata among epidermal cells – constant for a species.",
  f:[["s","Number of stomata (S)"],["e","Number of epidermal cells (E) in the same area"]],
  c:v=>{if(v.s<0||v.e<0||v.s+v.e<=0)return "Enter the counts.";const si=v.s/(v.s+v.e)*100;
   return {r:`Stomatal index = <b>${f2(si)}</b>`,s:[`SI = ${f4(v.s)} ÷ (${f4(v.s)} + ${f4(v.e)}) × 100 = ${f2(si)}`]}},
  fm:"Stomatal index = S ÷ (S + E) × 100",nt:"Count in several fields of the same surface (upper or lower epidermis) with a camera lucida or eyepiece grid, and take the mean. Subsidiary cells are counted as epidermal cells; each stoma (pair of guard cells) counts as one."},
 {id:"acidvalue",g:"Quality control",n:"Acid value",d:"mg KOH needed to neutralize the free fatty acids in 1 g of fixed oil, fat or resin.",
  f:[["w","Weight of sample (g)"],["v","Volume of KOH (or NaOH) used (mL)"],["n","Normality of KOH (N)",0.1],["vb","Blank titration (mL) – optional",0]],
  opt:["vb"],
  c:v=>{if(v.w<=0)return "Enter the sample weight.";if(v.n<=0)return "Enter the normality.";const net=v.v-(v.vb||0);if(net<0)return "Blank volume is larger than the sample titration.";
   const av=net*v.n*56.11/v.w,ffa=av*0.503;return {r:`Acid value = <b>${f2(av)}</b> mg KOH/g`,s:[(v.vb?`Net volume = ${f4(v.v)} − ${f4(v.vb)} = ${f4(net)} mL`:`Volume = ${f4(net)} mL`),`AV = ${f4(net)} × ${f4(v.n)} × 56.11 ÷ ${f4(v.w)} = ${f2(av)}`,`Free fatty acids (as oleic acid) ≈ AV × 0.503 = ${f2(ffa)} %`]}},
  fm:"Acid value = (V × N × 56.11) ÷ W   (V = mL KOH, N = normality, W = g sample; 56.11 = MW of KOH)",nt:"Dissolve the sample (about 10 g, or as stated in the monograph) in 50 mL of a neutralized 1:1 mixture of ethanol (96%) and ether (or petroleum ether), add 0.5–1 mL phenolphthalein, and titrate with 0.1 M KOH until the pink colour persists for at least 15 s. If a blank is run, subtract its titre."},
 {id:"wv",g:"Solutions",n:"% w/v solution",d:"How much solid to weigh.",f:[["p","Strength (% w/v)"],["v","Final volume (mL)"]],
  c:v=>{if(v.p<=0||v.v<=0)return "Enter values.";const g=v.p*v.v/100;return {r:`Weigh <b>${f4(g)} g</b>, dissolve, make up to <b>${f4(v.v)} mL</b>`,s:[`${f4(v.p)} × ${f4(v.v)} ÷ 100 = ${f4(g)} g`]}},fm:"grams = % × volume (mL) ÷ 100",nt:""},
 {id:"molar",g:"Solutions",n:"Molar solution",d:"Grams for a given molarity.",f:[["mw","Molecular weight (g/mol)"],["m","Molarity (M)"],["v","Final volume (mL)"]],
  c:v=>{if(v.mw<=0||v.m<=0||v.v<=0)return "Enter values.";const g=v.mw*v.m*v.v/1000;return {r:`Weigh <b>${f4(g)} g</b>, dissolve, make up to <b>${f4(v.v)} mL</b>`,s:[`${f4(v.mw)} × ${f4(v.m)} × ${f4(v.v)} ÷ 1000 = ${f4(g)} g`]}},fm:"grams = MW × M × volume (mL) ÷ 1000",nt:""},
 {id:"dilution",g:"Solutions",n:"Dilution (C₁V₁ = C₂V₂)",d:"Ethanol, acids, any stock.",f:[["c1","Stock concentration C₁"],["c2","Wanted concentration C₂"],["v2","Wanted final volume V₂ (mL)"]],
  c:v=>{if(v.c1<=0||v.c2<=0||v.v2<=0)return "Enter values.";if(v.c2>v.c1)return "Wanted concentration cannot exceed the stock.";const v1=v.c2*v.v2/v.c1;
   return {r:`Take <b>${f4(v1)} mL</b> stock, make up to <b>${f4(v.v2)} mL</b>`,s:[`V₁ = ${f4(v.c2)} × ${f4(v.v2)} ÷ ${f4(v.c1)} = ${f4(v1)} mL`,`Solvent ≈ ${f4(v.v2-v1)} mL`]}},fm:"V₁ = C₂ × V₂ ÷ C₁",nt:"Use the same units for C₁ and C₂. Always add acid to water."},
 {id:"rf",g:"TLC",n:"Rf value",d:"Retardation factor of a TLC spot.",f:[["d","Distance travelled by spot (cm)"],["s","Distance travelled by solvent front (cm)"]],
  c:v=>{if(v.d<=0||v.s<=0)return "Enter values.";if(v.d>v.s)return "Spot distance cannot exceed the solvent front.";const r=v.d/v.s;return {r:`Rf = <b>${r.toFixed(2)}</b>`,s:[`${f4(v.d)} ÷ ${f4(v.s)} = ${r.toFixed(2)}`]}},fm:"Rf = distance of spot ÷ distance of solvent front",nt:"Measure both from the start line."}
];
function tools(){setHeader("Calculators",true);navOn("tools");
 const groups=[...new Set(CALCS.map(c=>c.g))];
 app.innerHTML=groups.map(g=>`<div class="lbl">${esc(g==="Quality control"?"Pharmacognosy – quality control":g)}</div><div class="list">${CALCS.filter(c=>c.g===g).map(c=>`<div class="item" data-go="calc-${c.id}"><b>${esc(c.n)}</b><span>${esc(c.d)}</span></div>`).join("")}</div>`).join("");bind()}
function calc(id){const c=CALCS.find(x=>x.id===id);if(!c)return tools();setHeader("Calculator",true);navOn("tools");
 app.innerHTML=`<h2 class="title">${esc(c.n)}</h2><p class="aka">${esc(c.d)}</p>
 <div class="card"><h3>Enter values</h3>${c.f.map(([k,l,def])=>`<label class="f">${esc(l)}</label><input class="inp" id="c_${k}" type="number" inputmode="decimal" step="any"${def!=null?` value="${def}"`:""}>`).join("")}
 <div class="out" id="cout">Enter values.</div><div id="csteps"></div></div>
 <div class="card"><h3>Formula</h3>${esc(c.fm)}</div>
 ${c.nt?`<div class="card note"><h3>${ico("bulb")} Method</h3>${esc(c.nt)}</div>`:""}
 <div class="btnrow"><button class="btn pri" id="ccopy">Copy result</button></div>`;
 let last="";const run=()=>{const v={};let missing=false;c.f.forEach(([k])=>{const x=parseFloat($("#c_"+k).value);v[k]=isNaN(x)?(c.opt&&c.opt.includes(k)?0:NaN):x;if(isNaN(v[k]))missing=true});
  if(missing){$("#cout").innerHTML="Enter values.";$("#csteps").innerHTML="";last="";return}
  const r=c.c(v);if(typeof r==="string"){$("#cout").innerHTML=esc(r);$("#csteps").innerHTML="";last="";return}
  $("#cout").innerHTML=r.r;$("#csteps").innerHTML=`<ol class="calcsteps">${r.s.map(x=>`<li>${x}</li>`).join("")}</ol>`;
  last=`${c.n}\n`+c.f.map(([k,l])=>`${l}: ${$("#c_"+k).value||"-"}`).join("\n")+`\n\n`+r.s.join("\n")+`\nResult: ${r.r.replace(/<[^>]+>/g,"")}`};
 c.f.forEach(([k])=>$("#c_"+k).oninput=run);run();
 $("#ccopy").onclick=()=>last?copyText(last):toast("Enter values first")}

/* ============ CONTENT LOADER (elixir-lab-content.xlsx) ============ */
const CONTENT={source:"built-in",problems:[],file:"elixir-lab-content.xlsx"};
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function loadContent(){
 if(!/^https?:$/.test(location.protocol))return;
 let buf;try{const r=await fetch(CONTENT.file,{cache:"no-cache"});if(!r.ok)return;buf=await r.arrayBuffer()}catch(e){return}
 try{if(!window.XLSX)await loadScript("xlsx.mini.min.js")}catch(e){CONTENT.problems.push("Could not load xlsx.mini.min.js – upload it next to index.html.");return}
 try{applyContent(XLSX.read(buf,{type:"array"}))}catch(e){CONTENT.problems.push("Could not read the content file: "+e.message)}
 route()}
function applyContent(wb){
 const P=[],need=n=>{const ws=wb.Sheets[n];if(!ws){P.push(`Sheet “${n}” is missing.`);return []}return XLSX.utils.sheet_to_json(ws,{defval:"",raw:true})};
 const g=(row,pre)=>{const k=Object.keys(row).find(k=>k.trim().toLowerCase().startsWith(pre));return k==null?"":String(row[k]).trim()};
 const lines=s=>String(s).split(/\r?\n/).map(x=>x.trim()).filter(Boolean), list=s=>String(s).split(",").map(x=>x.trim()).filter(Boolean);
 const S=need("Sections"),RR=need("Reagents"),II=need("Ingredients"),TT=need("Tests");
 const sR=[],sT=[],sA=[],sG=[];S.forEach((r,i)=>{const id=g(r,"id");if(!id)return;const o={id,ic:g(r,"icon")||"•",n:g(r,"name")||id,d:g(r,"description")};
  const ty=g(r,"type").toLowerCase();if(ty.startsWith("r"))sR.push(o);else if(ty.startsWith("t"))sT.push(o);else if(ty.replace(/\s+/g," ").startsWith("atlas g"))sG.push(o);else if(ty.startsWith("a")){o.g=g(r,"group");sA.push(o)}else P.push(`Sections row ${i+2}: Type must be Reagent, Test or Atlas.`)});
 const seen=new Set(),dup=(id,where)=>{if(seen.has(id))P.push(`${where}: ID “${id}” is used twice.`);seen.add(id)};
 const ing={};II.forEach((r,i)=>{const rid=g(r,"reagent id");if(!rid)return;const name=g(r,"ingredient");if(!name){P.push(`Ingredients row ${i+2}: Ingredient is empty.`);return}
  let a=g(r,"amount"),u=g(r,"unit"),q=a===""?null:Number(a.replace(",","."));if(q!=null&&isNaN(q)){u=(a+" "+u).trim();q=null}
  const part=g(r,"part"),arr=ing[rid]=ing[rid]||[];let p=arr.find(x=>(x.t||"")===part);if(!p){p={t:part,i:[]};arr.push(p)}
  const it=[name,q,u];if(g(r,"make up").toUpperCase().startsWith("Y"))it.push("to");p.i.push(it)});
 const nR=[];RR.forEach((r,i)=>{const id=g(r,"id");if(!id)return;dup(id,`Reagents row ${i+2}`);const s=g(r,"section");
  if(!sR.some(x=>x.id===s))P.push(`Reagents “${id}”: Section ID “${s}” not found in Sections (Type = Reagent).`);
  if(!ing[id])P.push(`Reagent “${id}” has no rows in Ingredients.`);
  nR.push({id,s,n:g(r,"name")||id,a:g(r,"also"),u:g(r,"used"),y:Number(g(r,"makes"))||0,p:ing[id]||[{t:"",i:[]}],m:lines(g(r,"preparation")),
   t:g(r,"quick"),r:g(r,"positive"),st:g(r,"storage")||"—",h:list(g(r,"hazard")),sf:g(r,"safety"),nt:g(r,"notes")})});
 Object.keys(ing).forEach(k=>{if(!nR.some(r=>r.id===k))P.push(`Ingredients: Reagent ID “${k}” does not exist in Reagents.`)});
 const nT=[],cl={},std=[];TT.forEach((r,i)=>{const id=g(r,"id");if(!id)return;dup(id,`Tests row ${i+2}`);const c=g(r,"section");
  if(!sT.some(x=>x.id===c))P.push(`Test “${id}”: Section ID “${c}” not found in Sections (Type = Test).`);
  const pr=lines(g(r,"procedure"));if(!pr.length)P.push(`Test “${id}” has no procedure steps.`);
  nT.push({id,c,n:g(r,"name")||id,aim:g(r,"aim"),need:list(g(r,"prepare")),ex:lines(g(r,"also needed")),smp:g(r,"sample"),pr,
   pos:g(r,"positive"),neg:g(r,"negative"),ctl:g(r,"controls"),pc:lines(g(r,"precaution")),pi:imgList(g(r,"positive result image")),ni:imgList(g(r,"negative result image"))});
  const d=g(r,"detects");if(d)cl[id]=d;if(g(r,"standard").toUpperCase().startsWith("Y"))std.push(id)});
 nT.forEach(t=>t.need.forEach(x=>{if(!seen.has(x))P.push(`Test “${t.id}”: “Prepare first” ID “${x}” does not exist.`)}));
 const nA=[];if(wb.Sheets["Atlas"]){XLSX.utils.sheet_to_json(wb.Sheets["Atlas"],{defval:"",raw:true}).forEach((r,i)=>{const id=g(r,"id");if(!id)return;dup(id,`Atlas row ${i+2}`);const s=g(r,"section");
  if(!sA.some(x=>x.id===s))P.push(`Atlas “${id}”: Section ID “${s}” not found in Sections (Type = Atlas).`);
  if(sG.length){const sec=sA.find(x=>x.id===s);if(sec&&!sG.some(x=>x.id===sec.g))P.push(`Atlas section “${sec.id}”: Group “${sec.g}” not found (Type = Atlas group).`)}
  nA.push({id,s,cat:g(r,"category"),lat:g(r,"latin"),fam:g(r,"family"),n:g(r,"name")||id,f:lines(g(r,"key features")),sz:g(r,"size"),ex:g(r,"found in"),tst:g(r,"identification"),rel:list(g(r,"related")),img:imgList(g(r,"photo")),ts:imgList(g(r,"ts photo")),de:imgList(g(r,"diagnostic photo"))})});
  nA.forEach(a=>a.rel.forEach(x=>{if(!x.startsWith("calc-")&&!seen.has(x))P.push(`Atlas “${a.id}”: Related ID “${x}” does not exist.`);if(x.startsWith("calc-")&&!CALCS.some(c=>"calc-"+c.id===x))P.push(`Atlas “${a.id}”: calculator “${x}” does not exist.`)}))}
 if(!nR.length||!nT.length||!sR.length||!sT.length){CONTENT.problems=P.concat(["Content file looks empty – the built-in content is shown instead."]);return}
 SECTIONS.splice(0,SECTIONS.length,...sR);TSECS.splice(0,TSECS.length,...sT);R.splice(0,R.length,...nR);if(nA.length&&sA.length){ASECS.splice(0,ASECS.length,...sA);A.splice(0,A.length,...nA);if(sG.length)AGRPS.splice(0,AGRPS.length,...sG);if(!sG.length)ASECS.forEach(x=>x.g=x.g||"micro")}T.splice(0,T.length,...nT);
 Object.keys(CL).forEach(k=>delete CL[k]);Object.assign(CL,cl);
 buildPresets(std);
 CONTENT.source="file";CONTENT.problems=[...new Set(P)]}
function imgList(v){return String(v).split(/[,\n]/).map(x=>x.trim()).filter(Boolean)}
function contentCard(){const p=CONTENT.problems;
 return `<div class="card ${p.length?"safety":""}"><h3>${p.length?ico("warn")+" ":""}Content check</h3>
 Content source: <b>${CONTENT.source==="file"?CONTENT.file:"built into the app"}</b> · ${R.length} reagents · ${T.length} tests · ${A.length} atlas entries.
 ${p.length?`<ul class="pc">${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<div class="res pos" style="margin-top:8px">${ico("check")} No problems found.</div>`}</div>`}

/* ============ ROUTER (hash) ============ */
function route(){const h=location.hash.slice(1);window.scrollTo(0,0);
 if(!h||h==="tests")return testsHome();if(h==="reagents")return home();if(h==="search")return search();if(h==="saved")return saved();if(h==="tools")return tools();if(h==="more")return more();if(h==="start")return startHere();if(h==="atlas")return atlasHome();if(h.startsWith("calc-"))return calc(h.slice(5));if(h.startsWith("as-"))return asection(h.slice(3));if(h.startsWith("ag-"))return agroup(h.slice(3));if(h==="families")return families();if(h.startsWith("fam-"))return family(decodeURIComponent(h.slice(4)));if(h.startsWith("a-"))return atlasItem(h.slice(2));if(h==="about")return about();if(h==="results")return results();if(h.startsWith("sheet-"))return sheet(h.slice(6));
 if(h.startsWith("ts-"))return tsection(h.slice(3));if(h.startsWith("s-"))return section(h.slice(2));
 if(h.startsWith("r-"))return reagent(h.slice(2));if(h.startsWith("t-"))return test(h.slice(2));home()}
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h}
window.addEventListener("hashchange",route);
new MutationObserver(()=>hydrate(app)).observe(app,{childList:true,subtree:true});
document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest(".pimg,.thumb,.zoomwrap"))e.preventDefault()});
document.addEventListener("dragstart",e=>{if(e.target.tagName==="IMG")e.preventDefault()});
document.querySelectorAll("[data-ico]").forEach(e=>e.innerHTML=ico(e.dataset.ico));
$("#back").onclick=()=>{if(history.length>1)history.back();else go("")};
$("#info").onclick=()=>go("about");
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.go));
route();
loadContent();
try{if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script>
